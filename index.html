:root {
  /* Layout: one-thumb training log. Black header and tab bar, the next session
     as a white card you swipe, progress charts and history underneath. */
  --bg: #000000;
  --surface: #0c0c0c;
  --raised: #171717;
  --line: #242424;
  --line-2: #3a3a3a;
  --ink: #ffffff;
  --ink-2: #b9b9b9;
  --ink-3: #808080;
  --ink-4: #4d4d4d;
  --paper: #ffffff;
  --paper-ink: #000000;
  --paper-ink-2: #5c5c5c;
  --paper-line: #e2e2e2;
  --scrim: rgba(0, 0, 0, 0.66);
  --shadow: rgba(0, 0, 0, 0.5);
  --display: "Anton", Impact, "Arial Narrow Bold", "Helvetica Neue", sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 18px;
  --head-h: 58px;
  --tab-h: 60px;
  --gut: 16px;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html { background: var(--bg); -webkit-text-size-adjust: 100%; overflow-x: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
html.locked, html.locked body { overflow: hidden; }
img { max-width: 100%; }
[hidden] { display: none !important; }
button {
  font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
  cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.card :focus-visible, .card:focus-visible { outline-color: var(--ink); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; }

/* ---------- frame ---------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 520px; margin: 0 auto; height: var(--head-h);
  padding: 0 var(--gut); display: flex; align-items: center; gap: 12px;
}
.emblem { width: 38px; height: 38px; flex: none; display: block; }
.topbar h1 {
  flex: 1; margin: 0; font: 27px/1 var(--display);
  letter-spacing: 0.02em; text-transform: uppercase;
}
.icon-btn {
  width: 42px; height: 42px; margin-right: -8px; display: grid; place-items: center;
  border-radius: 50%; color: var(--ink-2);
}

main {
  max-width: 520px; margin: 0 auto; box-sizing: border-box;
  padding: calc(var(--head-h) + 18px) var(--gut) calc(var(--tab-h) + 36px);
  display: flex; flex-direction: column; gap: 34px;
}

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--bg); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-in {
  max-width: 520px; margin: 0 auto; height: var(--tab-h);
  display: grid; grid-template-columns: repeat(3, 1fr);
}
.tab {
  position: relative; display: grid; justify-items: center; align-content: center; gap: 3px;
  color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
}
.tab[aria-current="page"] { color: var(--ink); }
.due-dot {
  position: absolute; top: 8px; left: calc(50% + 13px);
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ink); box-shadow: 0 0 0 2px var(--bg);
}

/* ---------- type ---------- */
.sec-h {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin: 0 0 12px;
}
.sec-h h2 {
  margin: 0; font: 21px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase;
}
.sec-h .aside { font-size: 13px; color: var(--ink-3); }
.link {
  font-size: 14px; font-weight: 600; color: var(--ink);
  text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-4);
  padding: 6px 0;
}
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
p { margin: 0; }

/* ---------- swipe card ---------- */
.swipe { position: relative; --p: 0; }
.swipe-track {
  position: absolute; inset: 0; border-radius: var(--r);
  border: 1.5px dashed var(--line-2);
  display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
}
.swipe-track span {
  font: 22px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink-2); opacity: 0; padding: 12px 16px; border-radius: 999px;
  transition: background-color 0.15s, color 0.15s, transform 0.15s;
}
.swipe[data-dir="done"] .t-done,
.swipe[data-dir="skip"] .t-skip { opacity: calc(0.35 + var(--p) * 0.65); }
.swipe.armed[data-dir="done"] .t-done,
.swipe.armed[data-dir="skip"] .t-skip { background: var(--ink); color: var(--bg); transform: scale(1.06); }

.card {
  position: relative; background: var(--paper); color: var(--paper-ink);
  border-radius: var(--r); padding: 18px 18px 16px;
  touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
  cursor: grab;
}
.card.enter { animation: card-in 0.36s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes card-in { from { transform: translateY(16px) scale(0.98); opacity: 0.2; } }
.card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.when { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.card h3 {
  margin: 4px 0 8px; font: 34px/0.98 var(--display);
  letter-spacing: 0.01em; text-transform: uppercase;
}
.rows { display: flex; flex-direction: column; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline;
  column-gap: 12px; row-gap: 2px; padding: 10px 0 9px; border-top: 1px solid var(--paper-line);
}
.row .name {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; align-self: center;
  font-size: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
}
.row .name .pill { letter-spacing: 0.02em; }
.row .val { font-size: 27px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.05; text-align: right; white-space: nowrap; }
.row .val small { font-size: 14px; font-weight: 700; margin-left: 2px; letter-spacing: 0; }
.row .val.word { font-size: 20px; }
.row .meta {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px;
  font-size: 13px; line-height: 1.35; color: var(--paper-ink-2);
}
.row .meta b { color: var(--paper-ink); font-weight: 700; }
.row .meta.cue { color: var(--paper-ink); font-size: 14px; line-height: 1.4; }
.pill {
  display: inline-flex; align-items: center; height: 21px; padding: 0 8px;
  border-radius: 999px; border: 1.5px solid currentColor;
  font-size: 12px; font-weight: 800; letter-spacing: 0.02em; color: var(--paper-ink);
  white-space: nowrap;
}
.pill.solid { background: var(--paper-ink); color: var(--paper); border-color: var(--paper-ink); }
.notes {
  list-style: none; margin: 4px 0 0; padding: 12px 0 0; border-top: 1px solid var(--paper-line);
  display: grid; gap: 6px; font-size: 13.5px; line-height: 1.4;
}
.notes li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
.notes li::before { content: "→"; font-weight: 800; }
.fuel { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--paper-line); }
.fuel div { display: grid; grid-template-columns: 124px 1fr; gap: 10px; font-size: 13.5px; line-height: 1.35; }
.fuel b { font-weight: 800; }

.swipe-actions {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 12px;
}
.swipe-actions .hint { font-size: 12px; color: var(--ink-3); text-align: center; }
.btn {
  height: 48px; border-radius: 999px; padding: 0 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 15px; font-weight: 700; white-space: nowrap;
}
.btn.solid { background: var(--ink); color: var(--bg); }
.btn.line { border: 1.5px solid var(--line-2); color: var(--ink); }
.btn.quiet { color: var(--ink-2); }
.btn.danger { border: 1.5px solid var(--line-2); color: var(--ink-2); }
.btn.danger.armed { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }

/* ---------- panels, tiles, charts ---------- */
.panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 16px; }
.tipbox { display: grid; gap: 12px; }
.tipbox p { font-size: 14.5px; }
.tipbox .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.tipbox .btn { height: 40px; font-size: 14px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.tile {
  text-align: left; border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
  padding: 12px 12px 10px; display: grid; gap: 8px; min-width: 0;
}
.tile[aria-pressed="true"] { border-color: var(--ink); background: var(--raised); }
.tile.wide { grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); align-items: center; column-gap: 16px; }
.t-txt { display: grid; gap: 2px; min-width: 0; }
.t-name { font-size: 11.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-2); }
.t-val { font-size: 22px; font-weight: 700; line-height: 1.15; }
.t-val small { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.t-delta { font-size: 12px; color: var(--ink-3); }
.spark { position: relative; display: block; height: 32px; color: var(--ink); }
.spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.spark i {
  position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--ink);
  transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface);
}
.tile[aria-pressed="true"] .spark i { box-shadow: 0 0 0 2px var(--raised); }

.chart-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.chart-head h3 { margin: 0; font: 25px/1 var(--display); letter-spacing: 0.02em; text-transform: uppercase; }
.chart-head .nums { text-align: right; font-size: 13px; color: var(--ink-3); line-height: 1.35; }
.chart-head .nums b { color: var(--ink); font-size: 15px; }
.chart-wrap { position: relative; touch-action: pan-y; outline-offset: 4px; border-radius: 8px; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-axis { fill: var(--ink-3); font: 10.5px var(--body); font-variant-numeric: tabular-nums; }
.c-area { fill: var(--ink); opacity: 0.08; }
.c-line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.c-dot { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.c-dot.hollow { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.c-dot.on { stroke-width: 3; }
.c-ref { stroke: var(--ink-3); stroke-width: 1.25; stroke-dasharray: 4 4; }
.c-ref-label { fill: var(--ink-2); font: 600 10.5px var(--body); }
.c-fc { fill: none; stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 3 4; }
.c-fc-dot { fill: var(--surface); stroke: var(--ink-2); stroke-width: 2; stroke-dasharray: 2.5 2; }
.c-label { fill: var(--ink); font: 700 11px var(--body); }
.c-label.dim { fill: var(--ink-2); font-weight: 600; }
.c-cross { stroke: var(--ink-3); stroke-width: 1; opacity: 0; }
.c-empty { fill: var(--ink-3); font: 13px var(--body); }
.tip {
  position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none;
  background: var(--ink); color: var(--bg); border-radius: 9px; padding: 6px 9px;
  font-size: 12px; line-height: 1.3; white-space: nowrap; transform: translateX(-50%);
  box-shadow: 0 4px 14px var(--shadow);
}
.tip b { font-size: 14px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12px; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { overflow: visible; }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.item {
  width: 100%; text-align: left; display: grid; grid-template-columns: 46px minmax(0, 1fr) 16px;
  gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line);
}
.item .d { display: grid; line-height: 1.1; }
.d .dw { font-size: 10.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.d .dn { font-size: 21px; font-weight: 700; }
.d .dm { font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.what { min-width: 0; display: grid; gap: 2px; }
.what .t { font-weight: 700; }
.what .s { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.what .n { font-size: 12.5px; color: var(--ink-3); }
.item.skipped .t, .item.skipped .dn { color: var(--ink-3); }
.item.skipped .t { font-weight: 600; }
.chev { color: var(--ink-4); }
.more { margin-top: 10px; }

.cues { list-style: none; margin: 0; padding: 0; display: grid; border-top: 1px solid var(--line); }
.cues li { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.cues b { color: var(--ink); font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 2px; }

/* ---------- swim goal ---------- */
.goal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.goal-name { font: 24px/1 var(--display); letter-spacing: 0.02em; text-transform: uppercase; }
.goal-line { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.bar { height: 10px; border-radius: 99px; background: var(--raised); margin: 14px 0 8px; overflow: hidden; }
.bar i { display: block; height: 100%; min-width: 10px; border-radius: 99px; background: var(--ink); }
.goal-nums { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
.goal-nums b { color: var(--ink); }
.goal-desc { margin-top: 12px; font-size: 13.5px; color: var(--ink-2); }

/* ---------- basketball ---------- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px; }
.stat .v { font-size: 30px; font-weight: 700; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--ink-3); }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head .m { font: 21px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
.cal-nav { display: flex; gap: 4px; }
.cal-nav button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; }
.cal-nav button:disabled { opacity: 0.3; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px 4px; }
.cal .dh { text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--ink-3); padding-bottom: 2px; }
.cal .dh.gd { color: var(--ink); }
.day {
  position: relative; aspect-ratio: 1; width: 100%; max-width: 46px; justify-self: center;
  border-radius: 50%; display: grid; place-items: center;
  font-size: 14px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.day.gd { color: var(--ink); font-weight: 800; }
.day.played { background: var(--ink); color: var(--bg); font-weight: 800; }
.day.skipped::after {
  content: ""; position: absolute; left: 22%; right: 22%; top: 50%; height: 1.5px;
  background: var(--ink-3); transform: rotate(-40deg);
}
.day.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
.day.played.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
.day:disabled { color: var(--ink-4); cursor: default; font-weight: 600; }
.cal-key { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--ink-3); flex-wrap: wrap; }
.cal-key span { display: inline-flex; align-items: center; gap: 6px; }
.cal-key i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.cal-key i.p { background: var(--ink); }
.cal-key i.t { box-shadow: inset 0 0 0 1.5px var(--ink); }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity 0.25s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 560px; max-height: 92%;
  display: flex; flex-direction: column; box-sizing: border-box;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 22px 22px 0 0; transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet-wrap.open .scrim { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 99px; background: var(--line-2); margin: 8px auto 0; flex: none; }
.sheet-head { display: grid; grid-template-columns: 76px minmax(0, 1fr) 76px; align-items: center; padding: 6px 10px 6px; flex: none; }
.sheet-head h2 { margin: 0; text-align: center; font: 21px/1.1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
.sheet-head .link { justify-self: start; padding: 10px 6px; text-decoration: none; color: var(--ink-2); font-weight: 500; }
.sheet-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: 8px var(--gut) 18px; display: flex; flex-direction: column; gap: 22px;
}
.sheet-foot { flex: none; display: flex; gap: 10px; padding: 12px var(--gut) 14px; border-top: 1px solid var(--line); }
.sheet-foot .btn { flex: 1; }

.lbl { font-size: 11.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); }
.field { display: grid; gap: 8px; }
.inp {
  box-sizing: border-box; width: 100%; font: 16px var(--body); color: var(--ink);
  background: var(--raised); border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 12px;
}
textarea.inp { min-height: 96px; resize: vertical; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
input[type="date"].inp { min-height: 46px; -webkit-appearance: none; appearance: none; }

.block { display: grid; gap: 12px; padding-top: 18px; border-top: 1px solid var(--line); }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.block-head h3 { margin: 0; font: 22px/1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
.stepper {
  display: inline-flex; align-items: center; flex: none;
  border: 1px solid var(--line-2); border-radius: 999px; background: var(--raised);
}
.stepper button { width: 44px; height: 44px; font-size: 22px; line-height: 1; color: var(--ink); border-radius: 50%; }
.stepper input {
  width: 58px; text-align: center; font: 700 18px var(--body); color: var(--ink);
  background: transparent; border: 0; padding: 0; -moz-appearance: textfield;
}
.stepper .unit { font-size: 13px; color: var(--ink-3); margin: 0 4px 0 -6px; }
.stepper.sm button { width: 36px; height: 40px; font-size: 20px; }
.stepper.sm output { min-width: 26px; text-align: center; font-weight: 800; font-size: 17px; }
.sets { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.set {
  width: 50px; height: 50px; border-radius: 14px; background: var(--ink); color: var(--bg);
  font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums;
}
.set.short { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.sets .hint { font-size: 12.5px; color: var(--ink-3); flex: 1; min-width: 120px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; }
.seg button { height: 42px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button[aria-checked="true"] { background: var(--ink); color: var(--bg); }
.effort-desc { font-size: 13px; color: var(--ink-3); }
.next-prev {
  display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  font-size: 13.5px; color: var(--ink-2); background: var(--raised); border-radius: 10px; padding: 9px 12px;
}
.next-prev b { color: var(--ink); }
.pull-sets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pull-sets .ps { display: grid; gap: 6px; justify-items: center; }
.pull-sets .stepper { width: 100%; justify-content: space-between; }
.time-row { display: flex; align-items: center; gap: 8px; }
.time-row .inp { width: 84px; text-align: center; font-weight: 700; font-size: 20px; }
.time-row span { font-size: 22px; font-weight: 700; color: var(--ink-3); }
.calc { font-size: 13.5px; color: var(--ink-2); }
.calc b { color: var(--ink); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  min-width: 42px; height: 38px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--line-2); font-size: 13px; font-weight: 700; color: var(--ink-2);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.chips.days .chip { min-width: 0; padding: 0; font-size: 12.5px; }
.field.inline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.field.inline .inp { width: auto; min-width: 0; flex: 0 1 190px; }
.opts { display: grid; gap: 10px; }
.opt {
  text-align: left; border: 1px solid var(--line-2); border-radius: 14px; padding: 14px;
  display: grid; gap: 4px;
}
.opt[aria-checked="true"] { border-color: var(--ink); background: var(--raised); box-shadow: inset 0 0 0 1px var(--ink); }
.opt .o-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.opt .o-name { font: 20px/1.1 var(--display); letter-spacing: 0.03em; text-transform: uppercase; }
.opt .o-line { font-size: 13px; font-weight: 700; }
.opt .o-desc { font-size: 13px; color: var(--ink-2); }
.about { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 8px 0 4px; }
.about img { width: 124px; height: 124px; }
.about p { font-size: 13px; color: var(--ink-3); max-width: 34ch; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; z-index: 40; transform: translateX(-50%);
  bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 12px);
  width: min(488px, calc(100% - 32px)); box-sizing: border-box;
  display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px;
  font-size: 14px; line-height: 1.35; box-shadow: 0 10px 28px var(--shadow);
}
.toast .msg { flex: 1; min-width: 0; }
.toast button { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; padding: 6px 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
@media (min-width: 560px) {
  :root { --gut: 20px; }
}

</style>

        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5c1.7 0 1.7-1.5 3.3-1.5s1.7 1.5 3.4 1.5 1.6-1.5 3.3-1.5 1.7 1.5 3.3 1.5 1.7-1.5 3.4-1.5S20.3 9.5 22 9.5"/><path d="M2 15.5c1.7 0 1.7-1.5 3.3-1.5s1.7 1.5 3.4 1.5 1.6-1.5 3.3-1.5 1.7 1.5 3.3 1.5 1.7-1.5 3.4-1.5 1.6 1.5 3.3 1.5"/></svg>

<script>
/* PUSH Strength: training rules, scheduling and seed data. No DOM in here. */
(function (root) {
  'use strict';

  /* ---------- dates (local calendar days as YYYY-MM-DD) ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const dow = (s) => parse(s).getDay();                       // 0 = Sunday
  const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5); // days from a to b
  const today = () => iso(new Date());
  const later = (a, b) => (a > b ? a : b);
  const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const weekStart = (s) => addDays(s, -((dow(s) + 6) % 7));  // Monday

  const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DAY_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const shortDate = (s) => { const d = parse(s); return `${d.getDate()} ${MON[d.getMonth()]}`; };
  const dayDate = (s) => `${DAY[dow(s)]} ${shortDate(s)}`;

  /* ---------- numbers ---------- */
  const roundTo = (x, step) => Math.round(x / step) * step;
  const kg = (w) => String(Math.round(w * 100) / 100);
  const mmss = (sec) => { const t = Math.round(sec); return `${Math.floor(t / 60)}:${pad(t % 60)}`; };
  const sum = (a) => a.reduce((x, y) => x + y, 0);

  /* ---------- the program ---------- */
  const BAR = 20;
  const PLATES = [25, 20, 15, 10, 5, 2.5, 1.25];
  const LIFTS = {
    squat: { key: 'squat', name: 'Squat', short: 'Squat', inc: 5, sets: 3, reps: 5, session: 'A' },
    bench: { key: 'bench', name: 'Bench press', short: 'Bench', inc: 2.5, sets: 3, reps: 5, session: 'A' },
    deadlift: { key: 'deadlift', name: 'Deadlift', short: 'Deadlift', inc: 5, sets: 2, reps: 5, session: 'B' },
    ohp: { key: 'ohp', name: 'Overhead press', short: 'OHP', inc: 2.5, sets: 3, reps: 5, session: 'B' },
  };
  const START = { squat: 65, bench: 55, deadlift: 60, ohp: 42.5 };
  const SESSIONS = {
    A: { name: 'Squat & Bench', lifts: ['squat', 'bench'] },
    B: { name: 'Deadlift & Press', lifts: ['deadlift', 'ohp'] },
  };

  function platesPerSide(w) {
    let side = (w - BAR) / 2;
    if (side <= 0.001) return [];
    const out = [];
    for (const p of PLATES) {
      while (side >= p - 1e-9) { out.push(p); side -= p; }
    }
    return side > 0.01 ? null : out;
  }

  function warmups(key, w) {
    const steps = [[BAR, key === 'deadlift' ? 5 : 8]];
    const ramp = key === 'deadlift' && w >= 70 ? [[0.6, 5], [0.75, 3], [0.88, 2]] : [[0.6, 5], [0.8, 3]];
    for (const [pct, reps] of ramp) {
      const x = roundTo(w * pct, 5);
      if (x > steps[steps.length - 1][0] && x < w) steps.push([x, reps]);
    }
    return steps;
  }

  function isClean(key, it) {
    return it.reps.every((r) => r >= LIFTS[key].reps) && it.effort !== 'grind';
  }

  /* What a logged result means for next time. */
  function verdict(key, it) {
    const L = LIFTS[key];
    const total = sum(it.reps);
    const target = it.reps.length * L.reps;
    const missed = it.reps.some((r) => r < L.reps);
    if (missed && total < 0.8 * target) return 'drop';
    if (missed) return 'miss';
    if (it.effort === 'grind') return 'grind';
    if (it.effort === 'easy') return 'easy';
    return 'clean';
  }

  function liftHistory(state, key) {
    return state.lifts.filter((e) => e.status === 'done' && e.lifts && e.lifts[key]).sort(byDate);
  }

  function weeksLabel(days) {
    const w = Math.max(2, Math.round(days / 7));
    return `${w} weeks`;
  }

  /* The weight and sets for a lift on a given date, with the reason. */
  function liftPlan(state, key, onDate, extra) {
    const L = LIFTS[key];
    let hist = liftHistory(state, key);
    if (extra) hist = hist.concat([extra]).sort(byDate);
    if (!hist.length) {
      return { key, w: START[key], sets: L.sets, reps: L.reps, tag: 'Start', why: 'Starting weight', verdict: null, eased: false };
    }
    const lastE = hist[hist.length - 1];
    const it = lastE.lifts[key];
    const v = verdict(key, it);
    let w = it.w, tag, why;
    if (v === 'drop') {
      const prev = hist.slice(0, -1).reverse().map((e) => e.lifts[key]).find((x) => x.w < it.w && isClean(key, x));
      w = prev ? prev.w : Math.max(BAR, roundTo(it.w * 0.9, 2.5));
      tag = `−${kg(it.w - w)}`; why = `${kg(it.w)} kg was too heavy last time`;
    } else if (v === 'miss') {
      tag = 'Repeat'; why = 'Missed a rep last time';
    } else if (v === 'grind') {
      tag = 'Repeat'; why = 'Last time was a grind';
    } else if (v === 'easy') {
      w = it.w + 2 * L.inc; tag = `+${kg(2 * L.inc)}`; why = 'Last time felt easy';
    } else {
      w = it.w + L.inc; tag = `+${kg(L.inc)}`; why = 'Last time was clean';
    }

    let sets = L.sets;
    if (key === 'deadlift') {
      sets = Math.min(L.sets, it.reps.length || L.sets);
      const last2 = hist.slice(-2).map((e) => e.lifts[key]);
      if (sets > 1 && last2.length === 2 && last2.every((x) => !isClean(key, x))) {
        sets = 1; why = 'Stalled twice, so one heavy set from now on';
      }
    }

    let eased = false;
    const gap = onDate ? diff(lastE.date, onDate) : 0;
    if (gap >= 14) {
      w = Math.max(BAR, roundTo(w * 0.9, 2.5));
      eased = true; tag = '−10%'; why = `Eased after ${weeksLabel(gap)} off`;
    }
    return { key, w, sets, reps: L.reps, tag, why, verdict: v, eased, last: it, lastDate: lastE.date };
  }

  function pullHistory(state) {
    return state.lifts.filter((e) => e.status === 'done' && e.pull && e.pull.reps && e.pull.reps.length).sort(byDate);
  }

  function pullPlan(state) {
    const hist = pullHistory(state);
    if (!hist.length) return { reps: [5, 5, 5], add: 0, why: 'Max quality reps' };
    const last = hist[hist.length - 1].pull;
    const add = last.add || 0;
    if (last.reps[0] >= 10) {
      return { reps: last.reps.slice(), add: add + 2.5, last, why: `First set hit ${last.reps[0]}, so add 2.5 kg` };
    }
    const toGo = 10 - last.reps[0];
    return { reps: last.reps.slice(), add, last, why: `${toGo} more on set one, then add weight` };
  }

  /* ---------- scheduling ---------- */
  const isLiftDay = (s, d) => s.liftDays.includes(dow(d));
  const liftDaysSorted = (s) => Array.from(new Set(s.liftDays)).sort((a, b) => a - b);
  function firstLiftDay(s, from, inclusive) {
    let d = inclusive ? from : addDays(from, 1);
    for (let i = 0; i < 14; i++) {
      if (isLiftDay(s, d)) return d;
      d = addDays(d, 1);
    }
    return d;
  }
  function slotType(s, d) {
    const i = liftDaysSorted(s).indexOf(dow(d));
    return i <= 0 ? 'A' : 'B';
  }

  /* Which lifting session is next and when. */
  function nextLift(state, t) {
    const s = state.settings;
    const ents = state.lifts.slice().sort(byDate);
    const last = ents[ents.length - 1];
    const lastDone = ents.slice().reverse().find((e) => e.status === 'done');
    const pick = (due, fallback) => {
      if (!isLiftDay(s, due)) return fallback;
      const st = slotType(s, due);
      if (lastDone && st === lastDone.type && diff(lastDone.date, due) <= 3) return fallback;
      return st;
    };
    let type, due, moved = null;
    if (!last) {
      due = firstLiftDay(s, t, true);
      return { type: slotType(s, due), due, moved: null, back: false };
    }
    if (last.status === 'skipped') {
      due = addDays(last.date, 1);
      if (dow(due) === s.ballDay) due = addDays(due, 1);
      type = pick(due, last.type);
      if (type === last.type && !isLiftDay(s, due)) moved = last.date;
    } else {
      due = later(firstLiftDay(s, last.date, false), addDays(last.date, 2));
      if (dow(due) === s.ballDay) due = addDays(due, 1);
      type = pick(due, last.type === 'A' ? 'B' : 'A');
    }
    let back = false;
    if (diff(due, t) >= 3) {
      back = true;
      moved = null;
      let recent = null;
      for (let i = 0; i <= 2; i++) {
        const d = addDays(t, -i);
        if (isLiftDay(s, d) && d > last.date) { recent = d; break; }
      }
      due = recent || firstLiftDay(s, t, true);
      type = slotType(s, due);
    }
    return { type, due, moved, back };
  }

  /* Notes about the timing of a lifting session. */
  function liftNotes(state, nl) {
    const s = state.settings;
    const notes = [];
    if (nl.moved) notes.push(`Moved from ${DAY_LONG[dow(nl.moved)]}.`);
    const lastDone = state.lifts.filter((e) => e.status === 'done').sort(byDate).pop();
    if (lastDone && diff(lastDone.date, nl.due) === 1) notes.push('You lifted yesterday, so keep every rep smooth.');
    if (dow(nl.due) === s.swimDay) notes.push('Swim day too. Skip the swim if your legs need it.');
    if (dow(addDays(nl.due, 1)) === s.ballDay) notes.push('Basketball tomorrow. Leave a couple of reps in the tank.');
    if (dow(addDays(nl.due, -1)) === s.ballDay) notes.push('Day after basketball. If your legs feel flat, repeat the weight.');
    return notes;
  }

  /* Weekly things (swim, basketball): which date is up next. */
  function nextWeekly(entries, day, t, win) {
    const w = win == null ? 2 : win;
    const back = (dow(t) - day + 7) % 7;
    const recent = addDays(t, -back);
    const handled = (d) => entries.some((e) => Math.abs(diff(d, e.date)) <= w);
    if (back <= 2 && !handled(recent)) return { due: recent, late: back };
    let next = addDays(recent, 7);
    if (handled(next)) next = addDays(next, 7);
    return { due: next, late: 0 };
  }

  /* Most sessions landing a day late? Suggest moving the lift days. */
  function liftDayTip(state) {
    const s = state.settings;
    const recent = state.lifts
      .filter((e) => e.status === 'done' && e.date >= s.since)
      .sort(byDate)
      .slice(-4);
    if (recent.length < 4) return null;
    if (s.tipOff && s.tipOff >= recent[recent.length - 1].date) return null;
    const late = recent.filter((e) => !isLiftDay(s, e.date)).length;
    if (late < 3) return null;
    const days = liftDaysSorted(s).map((d) => (d + 1) % 7);
    if (days.includes(s.ballDay)) return null;
    return { late, of: recent.length, days };
  }

  /* ---------- swimming ---------- */
  const SWIM_GOALS = {
    faster1k: { id: 'faster1k', name: 'Faster 1K', line: '1 km in 22:30', time: 1350,
      desc: 'Same pool time, a faster clock. Most of the gain comes from a longer glide and better kick timing.' },
    longer: { id: 'longer', name: 'Go longer', line: 'Build to 1.5 km', dist: 1500,
      desc: 'Add about 100 m each week at an easy pace until you reach 1.5 km.' },
    stroke: { id: 'stroke', name: 'Smoother stroke', line: '3 fewer strokes per length', drop: 3,
      desc: 'Count strokes on a few lengths each swim. Fewer strokes for the same length means a better glide, and speed tends to follow.' },
    combo: { id: 'combo', name: 'Longer + faster', line: '1.5 km in 35:00', dist: 1500, pace: 140,
      desc: 'The long game. Build the distance first, then bring the pace down to 2:20 per 100 m.' },
  };
  const DRILLS = [
    { name: 'Glide count', cue: 'After each kick, hold the stretch for a 2 to 3 count. Count strokes on a few lengths.' },
    { name: 'Kick focus', cue: 'Do a few lengths kick-only with a board. Heels up first, then whip the feet around.' },
    { name: 'Breathing', cue: 'Breathe in as your arms pull. Breathe out slowly while you glide.' },
  ];
  const swimPace = (e) => (e.time / e.dist) * 100;
  const swimsDone = (state) => state.swims.filter((e) => e.status === 'done' && e.dist > 0 && e.time > 0).sort(byDate);

  function swimPlan(state) {
    const s = state.settings;
    const goal = SWIM_GOALS[s.swimGoal] || SWIM_GOALS.faster1k;
    const done = swimsDone(state);
    const last = done[done.length - 1];
    const base = s.swimBase;
    const basePace = swimPace(base);
    const lastPace = last ? swimPace(last) : basePace;
    const lastDist = last ? last.dist : base.dist;
    const focus = DRILLS[done.length % DRILLS.length];
    const withStrokes = done.filter((e) => e.strokes > 0);
    const lastStrokes = withStrokes.length ? withStrokes[withStrokes.length - 1].strokes : null;
    if (goal.id === 'faster1k') {
      const aim = Math.max(goal.time, roundTo(lastPace * 10 - 15, 5));
      return { goal, dist: 1000, aim, aimLabel: 'Aim', aimValue: mmss(aim), sub: `${mmss(aim / 10)} per 100 m`, focus };
    }
    if (goal.id === 'longer') {
      const d = Math.min(goal.dist, Math.max(lastDist, base.dist) + (last ? 100 : 0));
      const aim = roundTo(lastPace * d / 100, 5);
      return { goal, dist: d, aim, aimLabel: 'Distance', aimValue: `${d} m`, sub: `Easy pace, about ${mmss(aim)}`, focus };
    }
    if (goal.id === 'stroke') {
      const aimS = lastStrokes ? lastStrokes - 1 : null;
      return { goal, dist: lastDist, aim: roundTo(lastPace * lastDist / 100, 5), aimStrokes: aimS, aimLabel: 'Strokes',
        aimValue: aimS ? `${aimS} / length` : 'Count them', sub: aimS ? `One fewer than last time (${lastStrokes})` : 'Count strokes on 3 to 4 lengths', focus: DRILLS[0] };
    }
    const d = Math.min(goal.dist, Math.max(lastDist, base.dist) + (last ? 100 : 0));
    const aimPace = d >= goal.dist ? Math.max(goal.pace, lastPace - 2) : lastPace;
    const aim = roundTo(aimPace * d / 100, 5);
    return { goal, dist: d, aim, aimLabel: 'Aim', aimValue: mmss(aim), sub: `${d} m at ${mmss(aimPace)} per 100 m`, focus };
  }

  function swimProgress(state) {
    const s = state.settings;
    const goal = SWIM_GOALS[s.swimGoal] || SWIM_GOALS.faster1k;
    const done = swimsDone(state);
    const base = s.swimBase;
    const clamp = (x) => Math.max(0, Math.min(1, x));
    if (goal.id === 'faster1k') {
      const base1k = swimPace(base) * 10;
      const best = done.length ? Math.min(...done.map((e) => swimPace(e) * 10)) : base1k;
      return { pct: clamp((base1k - best) / (base1k - goal.time)), from: mmss(base1k), now: mmss(best), to: mmss(goal.time), nowLabel: done.length ? 'Best' : 'Start' };
    }
    if (goal.id === 'longer') {
      const best = done.length ? Math.max(...done.map((e) => e.dist)) : base.dist;
      return { pct: clamp((best - base.dist) / (goal.dist - base.dist)), from: `${base.dist} m`, now: `${best} m`, to: `${goal.dist} m`, nowLabel: done.length ? 'Longest' : 'Start' };
    }
    if (goal.id === 'stroke') {
      const ws = done.filter((e) => e.strokes > 0);
      if (!ws.length) return { pct: 0, from: '–', now: '–', to: '–', nowLabel: 'Best' };
      const first = ws[0].strokes, best = Math.min(...ws.map((e) => e.strokes));
      return { pct: clamp((first - best) / goal.drop), from: `${first}`, now: `${best}`, to: `${first - goal.drop}`, nowLabel: 'Best' };
    }
    const best = done.length ? Math.max(...done.map((e) => e.dist)) : base.dist;
    const atDist = done.filter((e) => e.dist >= goal.dist);
    const bestPace = atDist.length ? Math.min(...atDist.map(swimPace)) : null;
    const basePace = swimPace(base);
    const distPct = clamp((best - base.dist) / (goal.dist - base.dist));
    const pacePct = bestPace ? clamp((basePace - bestPace) / (basePace - goal.pace)) : 0;
    return { pct: (distPct + pacePct) / 2, from: `${base.dist} m`, now: bestPace ? `${best} m · ${mmss(bestPace)}` : `${best} m`, to: '1500 m · 2:20', nowLabel: 'Best' };
  }

  /* ---------- basketball ---------- */
  function ballStats(state, t) {
    const played = state.ball.filter((e) => e.status === 'done').map((e) => e.date);
    const set = new Set(played.map(weekStart));
    let w = weekStart(t);
    if (!set.has(w)) w = addDays(w, -7);
    let streak = 0;
    while (set.has(w)) { streak++; w = addDays(w, -7); }
    return {
      month: played.filter((d) => d.slice(0, 7) === t.slice(0, 7)).length,
      year: played.filter((d) => d.slice(0, 4) === t.slice(0, 4)).length,
      streak,
    };
  }

  /* ---------- seed: everything logged in our chat ---------- */
  function seed() {
    const x = (w, reps, effort) => ({ w, reps, effort });
    const L = (date, type, lifts, pull, note) => ({
      id: `chat-${date}`, date, type, status: 'done', lifts,
      pull: pull ? { reps: pull, add: 0 } : null, note: note || '', src: 'chat',
    });
    const S = (date, type) => ({ id: `chat-skip-${date}`, date, type, status: 'skipped', src: 'chat' });
    return {
      v: 1,
      settings: {
        liftDays: [1, 3], swimDay: 4, ballDay: 5, swimGoal: 'faster1k',
        swimBase: { dist: 1000, time: 1500 }, since: '2026-10-11', tipOff: null,
      },
      lifts: [
        L('2026-08-17', 'A', { squat: x(65, [5, 5, 5], 'clean'), bench: x(55, [5, 5, 5], 'clean') }, [4, 3, 3], 'First session'),
        L('2026-08-19', 'B', { deadlift: x(60, [5, 5], 'easy'), ohp: x(42.5, [5, 5, 4], 'grind') }, [6, 4, 4], 'First deadlift, kept it light'),
        S('2026-08-24', 'A'),
        L('2026-08-25', 'A', { squat: x(70, [5, 5, 5], 'clean'), bench: x(57.5, [5, 5, 5], 'grind') }, [5, 5, 5]),
        S('2026-08-26', 'B'),
        L('2026-08-27', 'B', { deadlift: x(65, [5, 5], 'easy'), ohp: x(42.5, [5, 5, 5], 'clean') }, [6, 5, 5], 'Pulled 80 kg × 2 by mistake in the warm-up'),
        S('2026-08-31', 'A'),
        L('2026-09-01', 'A', { squat: x(70, [5, 5, 5], 'grind'), bench: x(57.5, [5, 5, 5], 'grind') }, [6, 6, 5], 'Tried squat at 75 first, got 2 reps'),
        L('2026-09-03', 'B', { deadlift: x(75, [5, 5], 'clean'), ohp: x(45, [5, 5, 5], 'clean') }, null, 'Done as planned, details not logged'),
        S('2026-09-07', 'A'),
        L('2026-09-08', 'A', { squat: x(70, [5, 5, 5], 'clean'), bench: x(57.5, [5, 5, 5], 'grind') }, [7, 7, 6]),
        S('2026-09-14', 'A'),
        L('2026-09-15', 'A', { squat: x(75, [5, 5, 5], 'grind'), bench: x(57.5, [5, 5, 5], 'clean') }, [8, 7, 6]),
      ],
      swims: [],
      ball: [],
    };
  }

  root.PS = {
    iso, parse, addDays, dow, diff, today, byDate, weekStart, shortDate, dayDate,
    DAY, DAY_LONG, MON, MON_LONG, roundTo, kg, mmss, sum,
    BAR, LIFTS, START, SESSIONS, platesPerSide, warmups, isClean, verdict,
    liftHistory, liftPlan, pullHistory, pullPlan,
    isLiftDay, slotType, nextLift, liftNotes, nextWeekly, liftDayTip,
    SWIM_GOALS, DRILLS, swimPace, swimsDone, swimPlan, swimProgress,
    ballStats, seed,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* PUSH Strength: interface. Three tabs, swipe cards, log sheets, charts. */
(function () {
  'use strict';
  const PS = window.PS;
  const KEY = 'push-strength-v1';
  const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const T = () => PS.today();
  const num = (v) => { const x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : NaN; };

  const EFFORT = {
    easy: { label: 'Easy', desc: 'Had plenty left. Next time jumps twice as far.' },
    clean: { label: 'Clean', desc: 'Good form on every rep, even if it was hard.' },
    grind: { label: 'Grind', desc: 'The last reps were a fight. Next time repeats the weight.' },
  };
  const TITLES = { weights: 'Weights', swim: 'Swim', ball: 'Basketball' };
  function effortDesc(k, it) {
    const v = PS.verdict(k, it);
    if (v === 'drop') return 'Well short of 5s. Next time goes back to your last clean weight.';
    if (v === 'miss') return 'Missed a rep. Next time repeats the weight.';
    return EFFORT[it.effort].desc;
  }

  /* ---------- state ---------- */
  function normalize(s) {
    const base = PS.seed();
    s.settings = Object.assign({}, base.settings, s.settings || {});
    s.settings.swimBase = Object.assign({}, base.settings.swimBase, s.settings.swimBase || {});
    s.lifts = Array.isArray(s.lifts) ? s.lifts : [];
    s.swims = Array.isArray(s.swims) ? s.swims : [];
    s.ball = Array.isArray(s.ball) ? s.ball : [];
    return s;
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.v === 1) return normalize(s);
      }
    } catch (e) { /* storage unavailable: start from the seed */ }
    return PS.seed();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  let state = load();
  let liftSel = 'squat';
  let showAllLifts = false;
  let showAllSwims = false;
  let calMonth = T().slice(0, 7);
  let animateCard = false;
  let swipeCtl = null;
  let renderedDay = T();
  const main = $('#main');

  /* ---------- helpers ---------- */
  function whenLabel(due, t) {
    const d = PS.diff(t, due);
    if (d === 0) return { text: `Today · ${PS.dayDate(due)}`, late: 0 };
    if (d === 1) return { text: `Tomorrow · ${PS.dayDate(due)}`, late: 0 };
    if (d < 0) return { text: `${PS.DAY_LONG[PS.dow(due)]} · ${-d} day${d === -1 ? '' : 's'} late`, late: -d };
    return { text: `${PS.DAY_LONG[PS.dow(due)]} · ${PS.shortDate(due)}`, late: 0 };
  }
  const dateBlock = (date) => {
    const d = PS.parse(date);
    return `<span class="d"><span class="dw">${PS.DAY[d.getDay()]}</span><span class="dn">${d.getDate()}</span><span class="dm">${PS.MON[d.getMonth()]}</span></span>`;
  };
  const chev = '<svg class="chev" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
  const secHead = (title, aside) => `<div class="sec-h"><h2>${title}</h2>${aside || ''}</div>`;
  const km = (m) => (m >= 1000 ? `${(m / 1000).toFixed(m % 1000 ? (m % 100 ? 2 : 1) : 0)} km` : `${m} m`);
  const swimDue = (t) => PS.nextWeekly(state.swims, state.settings.swimDay, t, 2);
  const ballDue = (t) => PS.nextWeekly(state.ball, state.settings.ballDay, t, 1);

  function nextDateFor(k, t) {
    const nl = PS.nextLift(state, t);
    if (k === 'pull' || PS.SESSIONS[nl.type].lifts.includes(k)) return nl.due;
    const hypo = Object.assign({}, state, { lifts: state.lifts.concat([{ id: 'hypo', date: nl.due, type: nl.type, status: 'done', lifts: {} }]) });
    return PS.nextLift(hypo, nl.due).due;
  }

  function dueToday(t) {
    return {
      weights: PS.nextLift(state, t).due <= t,
      swim: swimDue(t).due <= t,
      ball: ballDue(t).due <= t,
    };
  }

  function initialTab() {
    const h = (location.hash || '').replace('#', '');
    if (TITLES[h]) return h;
    const t = T();
    const due = dueToday(t);
    if (due.weights) return 'weights';
    if (due.ball) return 'ball';
    if (due.swim) return 'swim';
    return 'weights';
  }
  let tab = initialTab();

  /* ---------- render ---------- */
  function render() {
    const t = T();
    renderedDay = t;
    $('#title').textContent = TITLES[tab];
    const due = dueToday(t);
    $$('.tab').forEach((b) => {
      const on = b.dataset.tab === tab;
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
      $('.due-dot', b).hidden = !due[b.dataset.tab];
      b.setAttribute('aria-label', TITLES[b.dataset.tab] + (due[b.dataset.tab] ? ', due' : ''));
    });
    main.innerHTML = tab === 'weights' ? viewWeights(t) : tab === 'swim' ? viewSwim(t) : viewBall(t);
    const sw = $('.swipe', main);
    swipeCtl = sw ? attachSwipe(sw, HANDLERS[tab]) : null;
    $$('.chart-wrap', main).forEach(bindChart);
    animateCard = false;
  }

  function setTab(next) {
    if (next === tab) { window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); return; }
    tab = next;
    $('#toast').hidden = true;
    try { history.replaceState(null, '', '#' + tab); } catch (e) { /* ignore */ }
    render();
    window.scrollTo(0, 0);
  }

  /* ---------- swipe card ---------- */
  const trackHTML = (done, skip) => `<div class="swipe-track" aria-hidden="true"><span class="t-done">✓ ${done}</span><span class="t-skip">${skip} ✕</span></div>`;
  const actionsHTML = (done, skip) => `<div class="swipe-actions">
      <button class="btn line" type="button" data-act="skip">← ${skip}</button>
      <span class="hint">or swipe<br>the card</span>
      <button class="btn solid" type="button" data-act="done">${done} →</button>
    </div>`;

  function attachSwipe(wrap, h) {
    const card = $('.card', wrap);
    let sx = 0, sy = 0, dx = 0, t0 = 0, id = null, active = false, decided = false, busy = false;
    const width = () => wrap.clientWidth || 320;
    const threshold = () => width() * 0.3;

    function paint() {
      card.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
      const p = Math.min(1, Math.abs(dx) / threshold());
      wrap.style.setProperty('--p', p.toFixed(3));
      wrap.dataset.dir = dx > 0 ? 'done' : dx < 0 ? 'skip' : '';
      wrap.classList.toggle('armed', p >= 1);
    }
    function reset() {
      dx = 0;
      card.style.transition = '';
      card.style.transform = '';
      wrap.dataset.dir = '';
      wrap.classList.remove('armed');
      wrap.style.setProperty('--p', '0');
    }
    function fly(dir) {
      if (busy) return;
      busy = true;
      wrap.dataset.dir = dir > 0 ? 'done' : 'skip';
      wrap.classList.add('armed');
      card.style.transition = reduced ? 'none' : 'transform .26s ease-in';
      card.style.transform = `translateX(${dir * (width() + 60)}px) rotate(${dir * 12}deg)`;
      setTimeout(() => { (dir > 0 ? h.done : h.skip)(); }, reduced ? 0 : 200);
    }
    card.addEventListener('pointerdown', (e) => {
      if (busy || (e.pointerType === 'mouse' && e.button !== 0)) return;
      id = e.pointerId; sx = e.clientX; sy = e.clientY; dx = 0; t0 = performance.now();
      active = true; decided = false;
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', (e) => {
      if (!active || e.pointerId !== id) return;
      const mx = e.clientX - sx, my = e.clientY - sy;
      if (!decided) {
        if (Math.abs(mx) < 7 && Math.abs(my) < 7) return;
        decided = true;
        if (Math.abs(my) > Math.abs(mx)) { active = false; reset(); return; }
        try { card.setPointerCapture(id); } catch (err) { /* ignore */ }
      }
      dx = mx;
      paint();
    });
    const end = (e) => {
      if (!active || (e && e.pointerId !== id)) return;
      active = false;
      const v = dx / Math.max(1, performance.now() - t0);
      if (dx > threshold() || (dx > 50 && v > 0.55)) fly(1);
      else if (dx < -threshold() || (dx < -50 && v < -0.55)) fly(-1);
      else reset();
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', () => { active = false; reset(); });
    card.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); fly(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); fly(-1); }
    });
    return { fly };
  }

  const HANDLERS = {
    weights: {
      done: () => { const nl = PS.nextLift(state, T()); openLiftSheet({ type: nl.type, planDate: nl.due }); },
      skip: () => skipLift(),
    },
    swim: {
      done: () => { const t = T(); const w = swimDue(t); openSwimSheet({ date: w.due <= t ? w.due : t }); },
      skip: () => skipWeekly('swims'),
    },
    ball: {
      done: () => logGame(),
      skip: () => skipWeekly('ball'),
    },
  };

  /* ---------- weights ---------- */
  function viewWeights(t) {
    const nl = PS.nextLift(state, t);
    const sess = PS.SESSIONS[nl.type];
    const plans = sess.lifts.map((k) => PS.liftPlan(state, k, nl.due));
    const pull = PS.pullPlan(state);
    const notes = PS.liftNotes(state, nl);
    const why = [];
    const allEased = plans.every((p) => p.eased);
    if (allEased) {
      const gap = PS.diff(plans[0].lastDate, nl.due);
      why.push(`Weights are eased 10% after ${Math.max(2, Math.round(gap / 7))} weeks off.`);
    }
    plans.forEach((p) => {
      const name = PS.LIFTS[p.key].name;
      if (p.eased && !allEased) why.push(`${name} is eased 10%. ${p.why}.`);
      else if (!p.eased && (p.verdict === 'grind' || p.verdict === 'miss')) why.push(`${name} repeats ${PS.kg(p.w)} kg. ${p.why}.`);
      else if (!p.eased && p.verdict === 'drop') why.push(`${name} goes back to ${PS.kg(p.w)} kg. ${p.why}.`);
      if (p.sets < PS.LIFTS[p.key].sets) why.push(`${name}: one heavy set of 5 from now on.`);
    });
    notes.unshift(...why);
    const tip = PS.liftDayTip(state);
    return `
      <section aria-label="Next session">
        <div class="swipe">
          ${trackHTML('Did it', 'Skip')}
          ${liftCard(nl, sess, plans, pull, notes, allEased, t)}
        </div>
        ${actionsHTML('Did it', 'Skip')}
      </section>
      ${tip ? tipHTML(tip) : ''}
      <section aria-labelledby="progH">
        ${secHead('<span id="progH">Progress</span>', '<span class="aside">Tap a lift</span>')}
        ${tilesHTML()}
        ${liftChartHTML(t)}
      </section>
      <section aria-labelledby="histH">
        ${secHead('<span id="histH">History</span>', `<span class="aside">${plural(state.lifts.filter((e) => e.status === 'done').length, 'session')}</span>`)}
        ${liftHistoryHTML()}
      </section>`;
  }

  function liftCard(nl, sess, plans, pull, notes, allEased, t) {
    const w = whenLabel(nl.due, t);
    const rows = plans.map((p) => {
      const L = PS.LIFTS[p.key];
      const plates = PS.platesPerSide(p.w);
      const plateTxt = plates == null ? '' : plates.length ? `${plates.map(PS.kg).join(' + ')} a side` : 'empty bar';
      const warm = PS.warmups(p.key, p.w).map(([x, r]) => `${x === PS.BAR ? 'bar' : PS.kg(x)}×${r}`).join(' · ');
      return `<div class="row">
          <span class="name">${L.name} <span class="pill" title="${esc(p.why)}">${esc(p.tag)}</span></span>
          <span class="val">${PS.kg(p.w)}<small>kg</small></span>
          <span class="meta"><b>${p.sets} × ${p.reps}</b><span>Warm-up ${warm}</span></span>
          ${plateTxt ? `<span class="meta">Plates ${plateTxt}</span>` : ''}
        </div>`;
    }).join('');
    const pullRow = `<div class="row">
        <span class="name">Pull-ups</span>
        <span class="val word">${pull.add ? `+${PS.kg(pull.add)}<small>kg</small>` : 'Max reps'}</span>
        <span class="meta"><b>3 sets</b>${pull.last ? `<span>Last ${pull.last.reps.join(' · ')}</span>` : ''}</span>
        <span class="meta">${esc(pull.why)}</span>
      </div>`;
    void allEased;
    return `<article class="card${animateCard ? ' enter' : ''}" tabindex="0" aria-label="${esc(sess.name)}, ${esc(w.text)}. Swipe right or press the right arrow if you did it, left to skip.">
        <div class="card-top"><span class="when">${esc(w.text)}</span>${w.late ? '<span class="pill solid">Make-up</span>' : ''}</div>
        <h3>${sess.name}</h3>
        <div class="rows">${rows}${pullRow}</div>
        ${notes.length ? `<ul class="notes">${notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
      </article>`;
  }

  function tipHTML(tip) {
    const names = tip.days.map((d) => PS.DAY[d]).join(' + ');
    return `<section class="panel tipbox" aria-label="Suggestion">
        <p><b>${tip.late} of your last ${tip.of} sessions happened a day late.</b> Moving your lift days to ${names} would give you the rest days you are actually getting.</p>
        <div class="acts">
          <button class="btn solid" type="button" data-act="tip-yes">Switch to ${names}</button>
          <button class="btn quiet" type="button" data-act="tip-no">Keep ${state.settings.liftDays.slice().sort().map((d) => PS.DAY[d]).join(' + ')}</button>
        </div>
      </section>`;
  }

  function sparkHTML(vals) {
    if (vals.length < 2) return '<span class="spark" aria-hidden="true"></span>';
    const W = 100, H = 32, p = 3;
    const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    const pts = vals.map((v, i) => [p + (i / (vals.length - 1)) * (W - 2 * p), H - p - ((v - lo) / span) * (H - 2 * p)]);
    const d = pts.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(' ');
    const [lx, ly] = pts[pts.length - 1];
    return `<span class="spark" aria-hidden="true"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg><i style="left:${lx}%;top:${(ly / H) * 100}%"></i></span>`;
  }

  function tilesHTML() {
    const out = ['squat', 'bench', 'deadlift', 'ohp'].map((k) => {
      const h = PS.liftHistory(state, k);
      const vals = h.map((e) => e.lifts[k].w);
      const last = vals[vals.length - 1];
      const delta = vals.length ? last - vals[0] : 0;
      const sub = vals.length ? `${delta >= 0 ? '+' : '−'}${PS.kg(Math.abs(delta))} kg since ${PS.shortDate(h[0].date)}` : 'Not lifted yet';
      return `<button class="tile" type="button" data-act="sel" data-key="${k}" aria-pressed="${liftSel === k}">
          <span class="t-txt"><span class="t-name">${PS.LIFTS[k].name}</span><span class="t-val">${last != null ? `${PS.kg(last)}<small> kg</small>` : '–'}</span><span class="t-delta">${sub}</span></span>
          ${sparkHTML(vals)}
        </button>`;
    });
    const ph = PS.pullHistory(state);
    const tot = ph.map((e) => PS.sum(e.pull.reps));
    const lastP = ph[ph.length - 1];
    const dP = tot.length ? tot[tot.length - 1] - tot[0] : 0;
    out.push(`<button class="tile wide" type="button" data-act="sel" data-key="pull" aria-pressed="${liftSel === 'pull'}">
        <span class="t-txt"><span class="t-name">Pull-ups</span><span class="t-val">${lastP ? lastP.pull.reps.join(' · ') : '–'}</span><span class="t-delta">${tot.length ? `${dP >= 0 ? '+' : '−'}${Math.abs(dP)} total reps since ${PS.shortDate(ph[0].date)}` : 'Not logged yet'}</span></span>
        ${sparkHTML(tot)}
      </button>`);
    return `<div class="tiles">${out.join('')}</div>`;
  }

  function liftChartHTML(t) {
    if (liftSel === 'pull') {
      const ph = PS.pullHistory(state);
      const pts = ph.map((e) => ({
        x: e.date, y: PS.sum(e.pull.reps),
        tip: `<b>${PS.sum(e.pull.reps)} reps</b>${e.pull.reps.join(' · ')}${e.pull.add ? ` · +${PS.kg(e.pull.add)} kg` : ''} · ${PS.dayDate(e.date)}`,
      }));
      const last = ph[ph.length - 1];
      return `<div class="panel">
          <div class="chart-head"><h3>Pull-ups</h3><div class="nums">Total reps, 3 sets<br>${last ? `Last <b>${last.pull.reps.join(' · ')}</b>` : ''}</div></div>
          ${chart({ points: pts, fmt: (v) => String(v), label: (v) => `${v}`, empty: 'Log a session to start the line.', aria: 'Pull-up total reps per session' })}
          <p class="small muted" style="margin-top:10px">Add weight once the first set reaches 10 clean reps.</p>
        </div>`;
    }
    const k = liftSel;
    const L = PS.LIFTS[k];
    const h = PS.liftHistory(state, k);
    const nd = nextDateFor(k, t);
    const plan = PS.liftPlan(state, k, nd);
    const pts = h.map((e) => {
      const it = e.lifts[k];
      const v = PS.verdict(k, it);
      const word = v === 'miss' || v === 'drop' ? 'missed reps' : EFFORT[it.effort] ? EFFORT[it.effort].label.toLowerCase() : '';
      return { x: e.date, y: it.w, hollow: !PS.isClean(k, it), tip: `<b>${PS.kg(it.w)} kg</b>${it.reps.join(' · ')} · ${word} · ${PS.dayDate(e.date)}` };
    });
    const last = h[h.length - 1];
    return `<div class="panel">
        <div class="chart-head"><h3>${L.name}</h3><div class="nums">${last ? `Last <b>${PS.kg(last.lifts[k].w)} kg</b><br>` : ''}Next <b>${PS.kg(plan.w)} kg</b> · ${PS.DAY[PS.dow(nd)]} ${PS.shortDate(nd)}</div></div>
        ${chart({
          points: pts, forecast: { x: nd, y: plan.w, label: `Next ${PS.kg(plan.w)}`, tip: `<b>Next ${PS.kg(plan.w)} kg</b>${esc(plan.why)} · ${PS.dayDate(nd)}` },
          fmt: (v) => PS.kg(v), label: (v) => PS.kg(v), empty: 'Log a session to start the line.', aria: `${L.name} working weight per session`,
        })}
        <div class="legend">
          <span><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="currentColor"/></svg>Clean or easy</span>
          <span><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Grind or missed reps</span>
          <span><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 1.6"/></svg>Planned</span>
        </div>
      </div>`;
  }

  function liftSummary(e) {
    const parts = [];
    const flags = [];
    PS.SESSIONS[e.type].lifts.forEach((k) => {
      const it = e.lifts && e.lifts[k];
      if (!it) return;
      parts.push(`${PS.LIFTS[k].short} ${PS.kg(it.w)}`);
      const v = PS.verdict(k, it);
      if (v === 'miss' || v === 'drop') flags.push(`${PS.LIFTS[k].short}: ${PS.sum(it.reps)}/${it.reps.length * PS.LIFTS[k].reps} reps`);
      else if (it.effort === 'grind') flags.push(`${PS.LIFTS[k].short}: grind`);
      else if (it.effort === 'easy') flags.push(`${PS.LIFTS[k].short}: easy`);
    });
    if (e.pull && e.pull.reps && PS.sum(e.pull.reps) > 0) parts.push(`Pull-ups ${e.pull.reps.join('·')}`);
    return { s: parts.join(' · '), flags };
  }

  function liftHistoryHTML() {
    const ents = state.lifts.slice().sort(PS.byDate).reverse();
    if (!ents.length) return '<p class="muted">Nothing logged yet.</p>';
    const shown = showAllLifts ? ents : ents.slice(0, 6);
    const rows = shown.map((e) => {
      if (e.status === 'skipped') {
        return `<button class="item skipped" type="button" data-act="edit-lift" data-id="${esc(e.id)}">${dateBlock(e.date)}<span class="what"><span class="t">Skipped</span><span class="n">${PS.SESSIONS[e.type].name}</span></span>${chev}</button>`;
      }
      const sm = liftSummary(e);
      const n = [sm.flags.join(' · '), e.note ? esc(e.note) : ''].filter(Boolean).join(' · ');
      return `<button class="item" type="button" data-act="edit-lift" data-id="${esc(e.id)}">${dateBlock(e.date)}<span class="what"><span class="t">${PS.SESSIONS[e.type].name}</span><span class="s">${esc(sm.s)}</span>${n ? `<span class="n">${n}</span>` : ''}</span>${chev}</button>`;
    }).join('');
    const more = ents.length > 6 ? `<button class="link more" type="button" data-act="more-lifts">${showAllLifts ? 'Show less' : `Show all ${ents.length}`}</button>` : '';
    return `<div class="list">${rows}</div>${more}`;
  }

  /* ---------- charts ---------- */
  const charts = {};
  let chartSeq = 0;

  function niceTicks(lo, hi) {
    const span = hi - lo || Math.abs(hi) * 0.1 || 1;
    const raw = span / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    let step = 10 * mag;
    for (const s of [1, 2, 5, 10]) { if (raw <= s * mag) { step = s * mag; break; } }
    const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
    const out = [];
    for (let v = a; v <= b + step / 1e3; v += step) out.push(Math.round(v * 1e4) / 1e4);
    if (out.length < 2) out.push(Math.round((a + step) * 1e4) / 1e4);
    return out;
  }
  function timeTicks(lo, hi) {
    const raw = (hi - lo || 60) / 4;
    const step = [15, 30, 60, 120, 300, 600].find((s) => raw <= s) || 600;
    const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
    const out = [];
    for (let v = a; v <= b; v += step) out.push(v);
    if (out.length < 2) out.push(a + step);
    return out;
  }

  function chart(o) {
    const id = `ch${++chartSeq}`;
    const W = 340, H = 180, pl = 38, pr = 16, pt = 24, pb = 26;
    const pts = o.points || [];
    const fc = o.forecast && pts.length ? o.forecast : null;
    const refs = (o.refs || []).filter(Boolean);
    let xs = pts.map((p) => p.x).concat(fc ? [fc.x] : []);
    const t = T();
    if (!xs.length) xs = [PS.addDays(t, -28), t];
    let x0 = xs.reduce((a, b) => (a < b ? a : b)), x1 = xs.reduce((a, b) => (a > b ? a : b));
    if (x0 === x1) { x0 = PS.addDays(x0, -7); x1 = PS.addDays(x1, 7); }
    const span = PS.diff(x0, x1);
    const padD = Math.max(1, span * 0.05);
    const X = (d) => pl + ((PS.diff(x0, d) + padD) / (span + 2 * padD)) * (W - pl - pr);
    let ys = pts.map((p) => p.y).concat(fc ? [fc.y] : [], refs.map((r) => r.y));
    if (!ys.length) ys = [0, 1];
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if (lo === hi) { lo -= o.time ? 60 : 5; hi += o.time ? 60 : 5; }
    const ticks = o.time ? timeTicks(lo, hi) : niceTicks(lo, hi);
    lo = ticks[0]; hi = ticks[ticks.length - 1];
    const Y = (v) => pt + (1 - (v - lo) / (hi - lo || 1)) * (H - pt - pb);
    const fmt = o.fmt || String;

    let g = '';
    ticks.forEach((v) => {
      g += `<line class="c-grid" x1="${pl}" x2="${W - pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/>`;
      g += `<text class="c-axis" x="${pl - 7}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
    });
    // x labels: month starts if the range covers two, else the ends
    const months = [];
    let m = `${x0.slice(0, 7)}-01`;
    if (m < x0) { const d = PS.parse(m); d.setMonth(d.getMonth() + 1); m = PS.iso(d); }
    while (m <= x1) { months.push(m); const d = PS.parse(m); d.setMonth(d.getMonth() + 1); m = PS.iso(d); }
    const xl = months.length >= 2 ? months.map((d) => [d, PS.MON[PS.parse(d).getMonth()]]) : [[x0, PS.shortDate(x0)], [x1, PS.shortDate(x1)]];
    (pts.length ? xl : []).forEach(([d, label], i) => {
      const anchor = months.length >= 2 ? 'middle' : i === 0 ? 'start' : 'end';
      g += `<text class="c-axis" x="${X(d).toFixed(1)}" y="${H - 6}" text-anchor="${anchor}">${label}</text>`;
    });
    refs.forEach((r) => {
      const y = Y(r.y).toFixed(1);
      g += `<line class="c-ref" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/>`;
      g += `<text class="c-ref-label" x="${W - pr}" y="${(Y(r.y) - 5).toFixed(1)}" text-anchor="end">${esc(r.label)}</text>`;
    });

    const meta = { W, H, pts: [] };
    if (pts.length) {
      const P = pts.map((p) => [X(p.x), Y(p.y)]);
      const line = P.map((q, i) => `${i ? 'L' : 'M'}${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(' ');
      if (P.length > 1) {
        g += `<path class="c-area" d="${line} L${P[P.length - 1][0].toFixed(1)} ${Y(lo).toFixed(1)} L${P[0][0].toFixed(1)} ${Y(lo).toFixed(1)} Z"/>`;
        g += `<path class="c-line" d="${line}"/>`;
      }
      const [lx, ly] = P[P.length - 1];
      let fcAbove = true;
      if (fc) {
        const fx = X(fc.x), fy = Y(fc.y);
        fcAbove = fy <= ly;
        g += `<path class="c-fc" d="M${lx.toFixed(1)} ${ly.toFixed(1)} L${fx.toFixed(1)} ${fy.toFixed(1)}"/>`;
        g += `<circle class="c-fc-dot" cx="${fx.toFixed(1)}" cy="${fy.toFixed(1)}" r="5"/>`;
        const ty = fcAbove ? fy - 11 : fy + 19;
        g += `<text class="c-label dim" x="${Math.min(fx + 6, W - 2).toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="end">${esc(fc.label)}</text>`;
        meta.pts.push({ cx: fx, cy: fy, html: fc.tip || esc(fc.label), i: -1 });
      }
      P.forEach((q, i) => {
        g += `<circle class="c-dot${pts[i].hollow ? ' hollow' : ''}" data-i="${i}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4.5"/>`;
        meta.pts.push({ cx: q[0], cy: q[1], html: pts[i].tip, i });
      });
      const lastLabel = o.label ? o.label(pts[pts.length - 1].y) : '';
      const clash = fc && Math.abs(X(fc.x) - lx) < 72;
      if (lastLabel && !clash) {
        g += `<text class="c-label" x="${lx.toFixed(1)}" y="${(ly - 11).toFixed(1)}" text-anchor="middle">${esc(lastLabel)}</text>`;
      }
    } else {
      g += `<text class="c-empty" x="${(pl + (W - pr)) / 2}" y="${(pt + (H - pb)) / 2 + 4}" text-anchor="middle">${esc(o.empty || 'No data yet')}</text>`;
    }
    g += `<line class="c-cross" x1="0" x2="0" y1="${pt - 8}" y2="${H - pb}"/>`;
    meta.pts.sort((a, b) => a.cx - b.cx);
    charts[id] = meta;
    return `<div class="chart-wrap" data-chart="${id}" tabindex="${meta.pts.length ? 0 : -1}" role="img" aria-label="${esc(o.aria || 'Chart')}"><svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg><div class="tip" hidden></div></div>`;
  }

  function bindChart(wrap) {
    const meta = charts[wrap.dataset.chart];
    if (!meta || !meta.pts.length) return;
    const svg = $('svg', wrap), tip = $('.tip', wrap), cross = $('.c-cross', svg);
    let cur = -1, sticky = false;
    function show(k) {
      cur = Math.max(0, Math.min(meta.pts.length - 1, k));
      const p = meta.pts[cur];
      cross.setAttribute('x1', p.cx); cross.setAttribute('x2', p.cx); cross.style.opacity = '1';
      $$('.c-dot', svg).forEach((d) => d.classList.toggle('on', +d.dataset.i === p.i));
      tip.innerHTML = p.html;
      tip.hidden = false;
      const r = svg.getBoundingClientRect();
      const sx = r.width / meta.W, sy = r.height / meta.H;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      const left = Math.max(tw / 2, Math.min(r.width - tw / 2, p.cx * sx));
      let top = p.cy * sy - th - 14;
      if (top < -6) top = p.cy * sy + 14;
      tip.style.left = `${left}px`;
      tip.style.top = `${top}px`;
    }
    function nearest(clientX) {
      const r = svg.getBoundingClientRect();
      const x = ((clientX - r.left) / r.width) * meta.W;
      let best = 0;
      meta.pts.forEach((p, i) => { if (Math.abs(p.cx - x) < Math.abs(meta.pts[best].cx - x)) best = i; });
      return best;
    }
    function hide() { tip.hidden = true; cross.style.opacity = '0'; $$('.c-dot', svg).forEach((d) => d.classList.remove('on')); cur = -1; }
    wrap.addEventListener('pointerdown', (e) => { sticky = e.pointerType !== 'mouse'; show(nearest(e.clientX)); });
    wrap.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) show(nearest(e.clientX)); });
    wrap.addEventListener('pointerleave', () => { if (!sticky) hide(); });
    wrap.addEventListener('focus', () => show(meta.pts.length - 1));
    wrap.addEventListener('blur', hide);
    wrap.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur < 0 ? meta.pts.length - 1 : cur - 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); show(cur < 0 ? 0 : cur + 1); }
      if (e.key === 'Escape') hide();
    });
    document.addEventListener('pointerdown', (e) => { if (!wrap.contains(e.target)) hide(); }, { passive: true });
  }

  /* ---------- swim ---------- */
  function viewSwim(t) {
    const s = state.settings;
    const due = swimDue(t);
    const plan = PS.swimPlan(state);
    const prog = PS.swimProgress(state);
    const goal = plan.goal;
    const w = whenLabel(due.due, t);
    const card = `<article class="card${animateCard ? ' enter' : ''}" tabindex="0" aria-label="Swim, ${esc(w.text)}. Swipe right if you swam, left to skip.">
        <div class="card-top"><span class="when">${esc(w.text)}</span>${due.late ? '<span class="pill solid">Log it</span>' : ''}</div>
        <h3>${km(plan.dist)} swim</h3>
        <div class="rows">
          <div class="row"><span class="name">${esc(plan.aimLabel)}</span><span class="val">${esc(plan.aimValue)}</span><span class="meta">${esc(plan.sub)}</span></div>
          <div class="row"><span class="name">Focus</span><span class="val word">${esc(plan.focus.name)}</span><span class="meta cue">${esc(plan.focus.cue)}</span></div>
        </div>
      </article>`;
    return `
      <section aria-label="Next swim">
        <div class="swipe">${trackHTML('Swam', 'Skip')}${card}</div>
        ${actionsHTML('Swam', 'Skip')}
      </section>
      <section aria-labelledby="goalH">
        ${secHead('<span id="goalH">Goal</span>', '<button class="link" type="button" data-act="goal">Change goal</button>')}
        <div class="panel">
          <div class="goal-top"><span class="goal-name">${esc(goal.name)}</span><span class="goal-line">${esc(goal.line)}</span></div>
          <div class="bar" role="progressbar" aria-label="Progress toward ${esc(goal.line)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(prog.pct * 100)}"><i style="width:${Math.round(prog.pct * 100)}%"></i></div>
          <div class="goal-nums"><span>Start <b>${esc(prog.from)}</b></span><span>${esc(prog.nowLabel)} <b>${esc(prog.now)}</b></span><span>Goal <b>${esc(prog.to)}</b></span></div>
          <p class="goal-desc">${esc(goal.desc)}</p>
        </div>
      </section>
      <section aria-labelledby="swimChartH">
        ${secHead('<span id="swimChartH">Progress</span>', `<span class="aside">${swimChartAside(goal)}</span>`)}
        <div class="panel">${swimChart(goal)}</div>
      </section>
      <section aria-labelledby="techH">
        ${secHead('<span id="techH">Technique</span>')}
        <ul class="cues">
          <li><b>Glide</b><span>After the kick, hold the stretch for a beat before the next pull. Rushing it costs the most energy.</span></li>
          <li><b>Kick</b><span>Heels up toward your seat first, then whip the feet around and snap them together.</span></li>
          <li><b>Breathe</b><span>In as your arms pull, out slowly while you glide. Never hold your breath under water.</span></li>
          <li><b>Head</b><span>Lift it just enough to clear the water. Looking forward drops your hips.</span></li>
        </ul>
      </section>
      <section aria-labelledby="swimHistH">
        ${secHead('<span id="swimHistH">History</span>', `<span class="aside">${plural(PS.swimsDone(state).length, 'swim')}</span>`)}
        ${swimHistoryHTML()}
      </section>`;
  }

  function swimChartAside(goal) {
    if (goal.id === 'faster1k') return '1 km time, lower is faster';
    if (goal.id === 'stroke') return 'Strokes per length';
    return 'Distance per swim';
  }

  function swimChart(goal) {
    const s = state.settings;
    const done = PS.swimsDone(state);
    const base = s.swimBase;
    if (goal.id === 'faster1k') {
      const pts = done.map((e) => {
        const t1k = PS.swimPace(e) * 10;
        return { x: e.date, y: Math.round(t1k), tip: `<b>${PS.mmss(t1k)}</b>${e.dist === 1000 ? '1 km' : `${km(e.dist)} in ${PS.mmss(e.time)}`} · ${PS.mmss(PS.swimPace(e))}/100 m · ${PS.dayDate(e.date)}` };
      });
      return chart({
        points: pts, time: true, fmt: (v) => PS.mmss(v), label: (v) => PS.mmss(v),
        refs: [{ y: base.time * 1000 / base.dist, label: `Start ${PS.mmss(base.time * 1000 / base.dist)}` }, { y: goal.time, label: `Goal ${PS.mmss(goal.time)}` }],
        empty: 'Log your first swim to start the line.', aria: '1 km time per swim',
      });
    }
    if (goal.id === 'stroke') {
      const ws = done.filter((e) => e.strokes > 0);
      const pts = ws.map((e) => ({ x: e.date, y: e.strokes, tip: `<b>${e.strokes} strokes</b>per length · ${PS.dayDate(e.date)}` }));
      return chart({
        points: pts, fmt: String, label: String,
        refs: ws.length ? [{ y: ws[0].strokes - 3, label: `Goal ${ws[0].strokes - 3}` }] : [],
        empty: 'Add a stroke count when you log a swim.', aria: 'Strokes per length per swim',
      });
    }
    const pts = done.map((e) => ({ x: e.date, y: e.dist, tip: `<b>${km(e.dist)}</b>${PS.mmss(e.time)} · ${PS.mmss(PS.swimPace(e))}/100 m · ${PS.dayDate(e.date)}` }));
    return chart({
      points: pts, fmt: (v) => `${v}`, label: (v) => `${v} m`,
      refs: [{ y: base.dist, label: `Start ${base.dist} m` }, { y: goal.dist, label: `Goal ${goal.dist} m` }],
      empty: 'Log your first swim to start the line.', aria: 'Distance per swim',
    });
  }

  function swimHistoryHTML() {
    const ents = state.swims.slice().sort(PS.byDate).reverse();
    if (!ents.length) return '<p class="muted small">Your swims will show up here. Swipe the card above after Thursday’s swim.</p>';
    const shown = showAllSwims ? ents : ents.slice(0, 6);
    const rows = shown.map((e) => {
      if (e.status === 'skipped') {
        return `<button class="item skipped" type="button" data-act="edit-swim" data-id="${esc(e.id)}">${dateBlock(e.date)}<span class="what"><span class="t">Skipped</span></span>${chev}</button>`;
      }
      const sub = `${PS.mmss(PS.swimPace(e))} per 100 m${e.strokes ? ` · ${e.strokes} strokes/length` : ''}`;
      return `<button class="item" type="button" data-act="edit-swim" data-id="${esc(e.id)}">${dateBlock(e.date)}<span class="what"><span class="t">${km(e.dist)} · ${PS.mmss(e.time)}</span><span class="s">${sub}</span>${e.note ? `<span class="n">${esc(e.note)}</span>` : ''}</span>${chev}</button>`;
    }).join('');
    const more = ents.length > 6 ? `<button class="link more" type="button" data-act="more-swims">${showAllSwims ? 'Show less' : `Show all ${ents.length}`}</button>` : '';
    return `<div class="list">${rows}</div>${more}`;
  }

  /* ---------- basketball ---------- */
  function viewBall(t) {
    const due = ballDue(t);
    const st = PS.ballStats(state, t);
    const w = whenLabel(due.due, t);
    const card = `<article class="card${animateCard ? ' enter' : ''}" tabindex="0" aria-label="Basketball, ${esc(w.text)}. Swipe right if you played, left if you sat it out.">
        <div class="card-top"><span class="when">${esc(w.text)}</span>${due.late ? '<span class="pill solid">Log it</span>' : ''}</div>
        <h3>Basketball</h3>
        <div class="rows"><div class="row"><span class="name">Played?</span><span class="val word">✓</span><span class="meta">Swipe right to check it off. That's all it takes.</span></div></div>
        <div class="fuel" aria-label="Game-day fuel">
          <div><b>2.5–3 h before</b><span>Biggest meal of the day. Carb-forward, light on fat.</span></div>
          <div><b>30–45 min before</b><span>A banana or a few dates if you need a top-up.</span></div>
          <div><b>All afternoon</b><span>Sip water with electrolytes.</span></div>
        </div>
      </article>`;
    return `
      <section aria-label="Next game">
        <div class="swipe">${trackHTML('Played', 'Skip')}${card}</div>
        ${actionsHTML('Played', 'Skip')}
      </section>
      <section aria-label="Games played">
        <div class="stats">
          <div class="stat"><div class="v">${st.month}</div><div class="l">This month</div></div>
          <div class="stat"><div class="v">${st.year}</div><div class="l">This year</div></div>
          <div class="stat"><div class="v">${st.streak}</div><div class="l">Week streak</div></div>
        </div>
      </section>
      <section aria-labelledby="calH">${calendarHTML(t)}</section>`;
  }

  function calendarHTML(t) {
    const [y, m] = calMonth.split('-').map(Number);
    const first = `${calMonth}-01`;
    const lead = (PS.dow(first) + 6) % 7;
    const daysIn = new Date(y, m, 0).getDate();
    const byDate = {};
    state.ball.forEach((e) => { byDate[e.date] = e.status; });
    const gd = state.settings.ballDay;
    const heads = [1, 2, 3, 4, 5, 6, 0].map((d) => `<span class="dh${d === gd ? ' gd' : ''}" aria-hidden="true">${PS.DAY[d].charAt(0)}</span>`).join('');
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span aria-hidden="true"></span>';
    for (let d = 1; d <= daysIn; d++) {
      const date = `${calMonth}-${String(d).padStart(2, '0')}`;
      const st = byDate[date];
      const cls = ['day'];
      if (PS.dow(date) === gd) cls.push('gd');
      if (st === 'done') cls.push('played');
      if (st === 'skipped') cls.push('skipped');
      if (date === t) cls.push('today');
      const label = `${PS.DAY_LONG[PS.dow(date)]} ${PS.shortDate(date)}${st === 'done' ? ', played' : st === 'skipped' ? ', skipped' : ''}`;
      cells += `<button class="${cls.join(' ')}" type="button" data-act="day" data-date="${date}" aria-label="${label}" aria-pressed="${st === 'done'}"${date > t ? ' disabled' : ''}>${d}</button>`;
    }
    const thisMonth = t.slice(0, 7);
