    return `<div class="cal-head"><span class="m" id="calH">${PS.MON_LONG[m - 1]} ${y}</span>
        <div class="cal-nav">
          <button type="button" data-act="cal-prev" aria-label="Previous month"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>
          <button type="button" data-act="cal-next" aria-label="Next month"${calMonth >= thisMonth ? ' disabled' : ''}><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
        </div></div>
      <div class="cal" role="group" aria-label="Games in ${PS.MON_LONG[m - 1]}">${heads}${cells}</div>
      <div class="cal-key"><span><i class="p"></i>Played</span><span><i class="t"></i>Today</span><span>Tap a day to add or remove a game</span></div>`;
  }

  /* ---------- actions ---------- */
  function skipLift() {
    const t = T();
    const nl = PS.nextLift(state, t);
    const e = { id: uid(), date: nl.due > t ? nl.due : t, type: nl.type, status: 'skipped' };
    state.lifts.push(e);
    save();
    animateCard = true;
    render();
    const n2 = PS.nextLift(state, t);
    const day = PS.DAY_LONG[PS.dow(n2.due)];
    const msg = n2.type === nl.type ? `Skipped. ${PS.SESSIONS[nl.type].name} moves to ${day}.` : `Skipped. Next up is ${PS.SESSIONS[n2.type].name} on ${day}.`;
    toast(msg, () => { state.lifts = state.lifts.filter((x) => x.id !== e.id); save(); render(); });
  }

  function skipWeekly(kind) {
    const t = T();
    const s = state.settings;
    const due = kind === 'swims' ? swimDue(t) : ballDue(t);
    const e = { id: uid(), date: due.due, status: 'skipped' };
    state[kind].push(e);
    save();
    animateCard = true;
    render();
    const nx = kind === 'swims' ? swimDue(t) : ballDue(t);
    toast(`${kind === 'swims' ? 'Swim' : 'Game'} skipped. Next one is ${PS.DAY_LONG[PS.dow(nx.due)]} ${PS.shortDate(nx.due)}.`, () => {
      state[kind] = state[kind].filter((x) => x.id !== e.id); save(); render();
    });
    void s;
  }

  function logGame() {
    const t = T();
    const due = ballDue(t);
    const e = { id: uid(), date: due.due <= t ? due.due : t, status: 'done' };
    state.ball.push(e);
    calMonth = e.date.slice(0, 7);
    save();
    animateCard = true;
    render();
    toast(`Game logged for ${PS.DAY_LONG[PS.dow(e.date)]}.`, () => { state.ball = state.ball.filter((x) => x.id !== e.id); save(); render(); });
  }

  function toggleGame(date) {
    const i = state.ball.findIndex((e) => e.date === date);
    if (i >= 0 && state.ball[i].status === 'done') state.ball.splice(i, 1);
    else if (i >= 0) state.ball[i].status = 'done';
    else state.ball.push({ id: uid(), date, status: 'done' });
    save();
    render();
    const btn = $(`.day[data-date="${date}"]`, main);
    if (btn) btn.focus({ preventScroll: true });
  }

  main.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || !main.contains(b)) return;
    const act = b.dataset.act;
    if (act === 'done' && swipeCtl) swipeCtl.fly(1);
    else if (act === 'skip' && swipeCtl) swipeCtl.fly(-1);
    else if (act === 'sel') { liftSel = b.dataset.key; render(); const nb = $(`.tile[data-key="${liftSel}"]`, main); if (nb) nb.focus({ preventScroll: true }); }
    else if (act === 'more-lifts') { showAllLifts = !showAllLifts; render(); }
    else if (act === 'more-swims') { showAllSwims = !showAllSwims; render(); }
    else if (act === 'edit-lift') editLift(b.dataset.id);
    else if (act === 'edit-swim') editSwim(b.dataset.id);
    else if (act === 'goal') openGoalSheet();
    else if (act === 'day') toggleGame(b.dataset.date);
    else if (act === 'cal-prev' || act === 'cal-next') {
      const d = PS.parse(`${calMonth}-01`);
      d.setMonth(d.getMonth() + (act === 'cal-prev' ? -1 : 1));
      calMonth = PS.iso(d).slice(0, 7);
      render();
      const nb = $(`[data-act="${act}"]`, main);
      if (nb && !nb.disabled) nb.focus({ preventScroll: true });
    } else if (act === 'tip-yes') {
      const tip = PS.liftDayTip(state);
      if (tip) {
        state.settings.liftDays = tip.days;
        state.settings.since = T();
        save(); render();
        toast(`Lift days are now ${tip.days.map((d) => PS.DAY_LONG[d]).join(' and ')}.`);
      }
    } else if (act === 'tip-no') {
      state.settings.tipOff = T();
      save(); render();
    }
  });

  /* ---------- sheets ---------- */
  let sheet = null;
  function openSheet(o) {
    closeSheet(true);
    const el = document.createElement('div');
    el.className = 'sheet-wrap';
    el.innerHTML = `<div class="scrim" data-close></div>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="grab" aria-hidden="true"></div>
        <header class="sheet-head"><button class="link" type="button" data-close>${o.closeLabel || 'Cancel'}</button><h2 id="sheetTitle">${o.title}</h2><span></span></header>
        <div class="sheet-body">${o.body}</div>
        ${o.foot ? `<footer class="sheet-foot">${o.foot}</footer>` : ''}
      </section>`;
    document.body.appendChild(el);
    document.documentElement.classList.add('locked');
    const prevFocus = document.activeElement;
    sheet = { el, onCancel: o.onCancel, prevFocus };
    el.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeSheet(); });
    el.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
    // trap focus inside the sheet
    el.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const f = $$('button:not([disabled]), input, textarea, [tabindex="0"]', el).filter((x) => x.offsetParent !== null);
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    });
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('open')));
    const sh = $('.sheet', el);
    if (o.mount) o.mount(sh);
    setTimeout(() => { const h = $('#sheetTitle', el); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }, 60);
    return sh;
  }
  function closeSheet(silent) {
    if (!sheet) return;
    const { el, onCancel, prevFocus } = sheet;
    sheet = null;
    el.classList.remove('open');
    document.documentElement.classList.remove('locked');
    setTimeout(() => el.remove(), reduced ? 0 : 320);
    if (!silent && onCancel) onCancel();
    if (prevFocus && prevFocus.isConnected && prevFocus.focus) prevFocus.focus({ preventScroll: true });
  }

  /* Lift session sheet: new log (from the card) or edit (from history). */
  function openLiftSheet({ type, planDate, entry }) {
    const t = T();
    const sess = PS.SESSIONS[type];
    const isNew = !entry;
    const model = { date: entry ? entry.date : t, note: entry ? entry.note || '' : '', lifts: {}, pull: null };
    sess.lifts.forEach((k) => {
      if (entry && entry.lifts && entry.lifts[k]) model.lifts[k] = JSON.parse(JSON.stringify(entry.lifts[k]));
      else {
        const p = PS.liftPlan(state, k, planDate || t);
        model.lifts[k] = { w: p.w, reps: Array(p.sets).fill(p.reps), effort: 'clean' };
      }
    });
    const pp = PS.pullPlan(state);
    if (entry) model.pull = entry.pull && entry.pull.reps ? JSON.parse(JSON.stringify(entry.pull)) : { reps: [0, 0, 0], add: 0 };
    else model.pull = { reps: pp.reps.slice(0, 3), add: pp.add };
    while (model.pull.reps.length < 3) model.pull.reps.push(0);
    let showAdd = model.pull.add > 0 || (pp.last && pp.last.reps[0] >= 10);

    const liftBlock = (k) => {
      const L = PS.LIFTS[k];
      const it = model.lifts[k];
      return `<div class="block" data-lift="${k}">
          <div class="block-head"><h3>${L.name}</h3>
            <div class="stepper"><button type="button" data-w="-1" aria-label="Less weight">−</button><input id="w-${k}" inputmode="decimal" autocomplete="off" value="${PS.kg(it.w)}" aria-label="${L.name} weight in kilograms"><span class="unit">kg</span><button type="button" data-w="1" aria-label="More weight">+</button></div>
          </div>
          <div class="sets" role="group" aria-label="Reps per set">
            ${it.reps.map((r, i) => `<button class="set${r < L.reps ? ' short' : ''}" type="button" data-set="${i}" aria-label="Set ${i + 1}: ${r} reps">${r}</button>`).join('')}
            <span class="hint">Tap a set to take a rep off</span>
          </div>
          <div class="seg" role="radiogroup" aria-label="How did ${L.name.toLowerCase()} feel?">
            ${Object.keys(EFFORT).map((key) => `<button type="button" role="radio" data-effort="${key}" aria-checked="${it.effort === key}">${EFFORT[key].label}</button>`).join('')}
          </div>
          <p class="effort-desc">${effortDesc(k, it)}</p>
          ${isNew ? '<div class="next-prev"></div>' : ''}
        </div>`;
    };
    const pullBlock = () => `<div class="block" data-pull>
        <div class="block-head"><h3>Pull-ups</h3>${showAdd ? '' : '<button class="link" type="button" data-addw>Add weight</button>'}</div>
        <div class="pull-sets">
          ${model.pull.reps.map((r, i) => `<div class="ps"><span class="lbl">Set ${i + 1}</span><div class="stepper sm"><button type="button" data-pr="${i}" data-d="-1" aria-label="Set ${i + 1} fewer reps">−</button><output id="pr-${i}">${r}</output><button type="button" data-pr="${i}" data-d="1" aria-label="Set ${i + 1} more reps">+</button></div></div>`).join('')}
        </div>
        ${showAdd ? `<div class="block-head"><span class="lbl">Extra weight</span><div class="stepper"><button type="button" data-pa="-1" aria-label="Less extra weight">−</button><input id="pull-add" inputmode="decimal" value="${PS.kg(model.pull.add)}" aria-label="Pull-up extra weight in kilograms"><span class="unit">kg</span><button type="button" data-pa="1" aria-label="More extra weight">+</button></div></div>` : ''}
        <p class="effort-desc">${esc(pp.why)}</p>
      </div>`;

    const body = () => `
      <div class="field inline"><label class="lbl" for="logDate">Date</label><input class="inp" type="date" id="logDate" value="${model.date}" max="${t}"></div>
      ${sess.lifts.map(liftBlock).join('')}
      ${pullBlock()}
      <div class="field"><label class="lbl" for="logNote">Note</label><input class="inp" id="logNote" maxlength="160" placeholder="Optional" value="${esc(model.note)}"></div>
      ${entry ? '<button class="btn danger" type="button" data-del>Delete this session</button>' : ''}`;

    const sh = openSheet({
      title: isNew ? sess.name : `Edit ${PS.shortDate(entry.date)}`,
      body: body(),
      foot: `<button class="btn solid" type="button" data-save>${isNew ? 'Save session' : 'Save changes'}</button>`,
      onCancel: () => { if (isNew) { animateCard = true; render(); } },
      mount: (el) => wire(el),
    });

    function updatePreview(el) {
      if (!isNew) return;
      sess.lifts.forEach((k) => {
        const box = $(`[data-lift="${k}"] .next-prev`, el);
        if (!box) return;
        const it = model.lifts[k];
        if (!(it.w > 0)) { box.innerHTML = ''; return; }
        const extra = { date: model.date, type, status: 'done', lifts: { [k]: it } };
        const p = PS.liftPlan(state, k, null, extra);
        box.innerHTML = `<span>Next time</span><span><b>${PS.kg(p.w)} kg</b>${p.sets !== PS.LIFTS[k].sets ? ` · ${p.sets} set` : ''} · ${esc(p.tag.toLowerCase())}</span>`;
      });
    }

    function redrawBlock(el, k) {
      const blk = $(`[data-lift="${k}"]`, el);
      const tmp = document.createElement('div');
      tmp.innerHTML = liftBlock(k);
      blk.replaceWith(tmp.firstElementChild);
      updatePreview(el);
    }
    function redrawPull(el) {
      const blk = $('[data-pull]', el);
      const tmp = document.createElement('div');
      tmp.innerHTML = pullBlock();
      blk.replaceWith(tmp.firstElementChild);
    }

    function wire(el) {
      updatePreview(el);
      el.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        const lb = b.closest('[data-lift]');
        if (lb) {
          const k = lb.dataset.lift, it = model.lifts[k], L = PS.LIFTS[k];
          if (b.dataset.w) {
            const cur = num($(`#w-${k}`, el).value);
            it.w = Math.max(0, PS.roundTo((isFinite(cur) ? cur : it.w) + Number(b.dataset.w) * 2.5, 1.25));
            $(`#w-${k}`, el).value = PS.kg(it.w);
            updatePreview(el);
          } else if (b.dataset.set != null) {
            const i = +b.dataset.set;
            it.reps[i] = it.reps[i] <= 0 ? L.reps : it.reps[i] - 1;
            redrawBlock(el, k);
            const nb = $(`[data-lift="${k}"] [data-set="${i}"]`, el); if (nb) nb.focus({ preventScroll: true });
          } else if (b.dataset.effort) {
            it.effort = b.dataset.effort;
            redrawBlock(el, k);
            const nb = $(`[data-lift="${k}"] [data-effort="${it.effort}"]`, el); if (nb) nb.focus({ preventScroll: true });
          }
          return;
        }
        if (b.dataset.pr != null) {
          const i = +b.dataset.pr;
          model.pull.reps[i] = Math.max(0, Math.min(60, model.pull.reps[i] + Number(b.dataset.d)));
          $(`#pr-${i}`, el).textContent = model.pull.reps[i];
          return;
        }
        if (b.dataset.pa) {
          const cur = num($('#pull-add', el).value);
          model.pull.add = Math.max(0, PS.roundTo((isFinite(cur) ? cur : model.pull.add) + Number(b.dataset.pa) * 2.5, 1.25));
          $('#pull-add', el).value = PS.kg(model.pull.add);
          return;
        }
        if (b.hasAttribute('data-addw')) { showAdd = true; redrawPull(el); const i = $('#pull-add', el); if (i) i.focus(); return; }
        if (b.hasAttribute('data-del')) {
          if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap again to delete'; return; }
          state.lifts = state.lifts.filter((x) => x.id !== entry.id);
          save(); closeSheet(true); render(); toast('Session deleted.');
          return;
        }
        if (b.hasAttribute('data-save')) commit(el);
      });
      el.addEventListener('input', (e) => {
        const tg = e.target;
        if (tg.id === 'logDate') { if (tg.value) model.date = tg.value > t ? t : tg.value; updatePreview(el); }
        else if (tg.id === 'logNote') model.note = tg.value;
        else if (tg.id === 'pull-add') { const v = num(tg.value); if (isFinite(v)) model.pull.add = Math.max(0, v); }
        else if (tg.id && tg.id.indexOf('w-') === 0) {
          const k = tg.id.slice(2), v = num(tg.value);
          if (isFinite(v)) { model.lifts[k].w = Math.max(0, v); updatePreview(el); }
        }
      });
    }

    function commit(el) {
      for (const k of sess.lifts) {
        if (!(model.lifts[k].w >= PS.BAR)) { const i = $(`#w-${k}`, el); i.focus(); toast(`Enter the ${PS.LIFTS[k].name.toLowerCase()} weight (20 kg or more).`); return; }
      }
      const e = entry || { id: uid(), type, status: 'done' };
      e.status = 'done';
      e.date = model.date || t;
      e.lifts = model.lifts;
      e.pull = PS.sum(model.pull.reps) > 0 ? { reps: model.pull.reps.slice(), add: model.pull.add || 0 } : null;
      e.note = (model.note || '').trim();
      delete e.src;
      if (isNew) state.lifts.push(e);
      save();
      closeSheet(true);
      animateCard = isNew;
      render();
      if (isNew) {
        const n2 = PS.nextLift(state, T());
        const next = PS.SESSIONS[n2.type].lifts.map((k) => `${PS.LIFTS[k].short} ${PS.kg(PS.liftPlan(state, k, n2.due).w)}`).join(' · ');
        toast(`Saved. Next: ${PS.DAY_LONG[PS.dow(n2.due)]}, ${next}.`, () => { state.lifts = state.lifts.filter((x) => x.id !== e.id); save(); render(); });
      } else toast('Changes saved.');
    }
    return sh;
  }

  function editLift(id) {
    const e = state.lifts.find((x) => x.id === id);
    if (!e) return;
    if (e.status === 'done') { openLiftSheet({ type: e.type, entry: e }); return; }
    openSheet({
      title: 'Skipped session',
      body: `<p>${PS.SESSIONS[e.type].name} was skipped on ${PS.DAY_LONG[PS.dow(e.date)]} ${PS.shortDate(e.date)}. Removing the skip puts the schedule back as if it never happened.</p>`,
      foot: '<button class="btn solid" type="button" data-rm>Remove skip</button>',
      mount: (el) => {
        $('[data-rm]', el).addEventListener('click', () => {
          state.lifts = state.lifts.filter((x) => x.id !== id);
          save(); closeSheet(true); render(); toast('Skip removed.');
        });
      },
    });
  }

  /* Swim sheet */
  function openSwimSheet({ date, entry }) {
    const t = T();
    const plan = PS.swimPlan(state);
    const isNew = !entry;
    const m = entry
      ? { date: entry.date, dist: entry.dist, time: entry.time, strokes: entry.strokes || '', note: entry.note || '' }
      : { date, dist: plan.dist, time: plan.aim, strokes: '', note: '' };
    const body = `
      <div class="field inline"><label class="lbl" for="swDate">Date</label><input class="inp" type="date" id="swDate" value="${m.date}" max="${t}"></div>
      <div class="block">
        <div class="block-head"><h3>Distance</h3><div class="stepper"><button type="button" data-dd="-1" aria-label="50 metres less">−</button><input id="swDist" inputmode="numeric" value="${m.dist}" aria-label="Distance in metres"><span class="unit">m</span><button type="button" data-dd="1" aria-label="50 metres more">+</button></div></div>
      </div>
      <div class="block">
        <div class="block-head"><h3>Time</h3>
          <div class="time-row"><input class="inp" id="swMin" inputmode="numeric" pattern="[0-9]*" value="${Math.floor(m.time / 60)}" aria-label="Minutes"><span>:</span><input class="inp" id="swSec" inputmode="numeric" pattern="[0-9]*" value="${String(Math.round(m.time % 60)).padStart(2, '0')}" aria-label="Seconds"></div>
        </div>
        <p class="calc" id="swCalc"></p>
      </div>
      <div class="block">
        <div class="field"><label class="lbl" for="swStrokes">Strokes per length (optional)</label><input class="inp" id="swStrokes" inputmode="numeric" pattern="[0-9]*" placeholder="Count a few lengths" value="${m.strokes}"></div>
      </div>
      <div class="field"><label class="lbl" for="swNote">Note</label><input class="inp" id="swNote" maxlength="160" placeholder="Optional" value="${esc(m.note)}"></div>
      ${entry ? '<button class="btn danger" type="button" data-del>Delete this swim</button>' : ''}`;
    openSheet({
      title: isNew ? 'Log swim' : `Edit ${PS.shortDate(entry.date)}`,
      body,
      foot: `<button class="btn solid" type="button" data-save>${isNew ? 'Save swim' : 'Save changes'}</button>`,
      onCancel: () => { if (isNew) { animateCard = true; render(); } },
      mount: (el) => {
        const read = () => {
          const d = parseInt($('#swDist', el).value, 10);
          const mi = parseInt($('#swMin', el).value || '0', 10), se = parseInt($('#swSec', el).value || '0', 10);
          return { d, time: (isFinite(mi) ? mi : 0) * 60 + (isFinite(se) ? se : 0) };
        };
        const calc = () => {
          const r = read();
          const out = $('#swCalc', el);
          if (r.d > 0 && r.time > 0) {
            const pace = (r.time / r.d) * 100;
            out.innerHTML = `Pace <b>${PS.mmss(pace)}</b> per 100 m · 1 km in <b>${PS.mmss(pace * 10)}</b>`;
          } else out.textContent = 'Enter distance and time to see your pace.';
        };
        calc();
        el.addEventListener('input', (e) => { if (['swDist', 'swMin', 'swSec'].includes(e.target.id)) calc(); });
        el.addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          if (b.dataset.dd) {
            const cur = parseInt($('#swDist', el).value, 10) || 0;
            $('#swDist', el).value = Math.max(50, cur + Number(b.dataset.dd) * 50);
            calc();
          } else if (b.hasAttribute('data-del')) {
            if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap again to delete'; return; }
            state.swims = state.swims.filter((x) => x.id !== entry.id);
            save(); closeSheet(true); render(); toast('Swim deleted.');
          } else if (b.hasAttribute('data-save')) {
            const r = read();
            if (!(r.d > 0)) { $('#swDist', el).focus(); toast('Enter the distance in metres.'); return; }
            if (!(r.time > 0)) { $('#swMin', el).focus(); toast('Enter your time.'); return; }
            const sv = parseInt($('#swStrokes', el).value, 10);
            const dv = $('#swDate', el).value || t;
            const e2 = entry || { id: uid() };
            Object.assign(e2, { date: dv > t ? t : dv, status: 'done', dist: r.d, time: r.time, strokes: sv > 0 ? sv : null, note: $('#swNote', el).value.trim() });
            if (isNew) state.swims.push(e2);
            save(); closeSheet(true); animateCard = isNew; render();
            toast(isNew ? `Saved. ${km(r.d)} at ${PS.mmss((r.time / r.d) * 100)} per 100 m.` : 'Changes saved.', isNew ? () => { state.swims = state.swims.filter((x) => x.id !== e2.id); save(); render(); } : null);
          }
        });
      },
    });
  }

  function editSwim(id) {
    const e = state.swims.find((x) => x.id === id);
    if (!e) return;
    if (e.status === 'done') { openSwimSheet({ entry: e }); return; }
    openSheet({
      title: 'Skipped swim',
      body: `<p>Skipped on ${PS.DAY_LONG[PS.dow(e.date)]} ${PS.shortDate(e.date)}.</p>`,
      foot: '<button class="btn solid" type="button" data-rm>Remove skip</button>',
      mount: (el) => {
        $('[data-rm]', el).addEventListener('click', () => {
          state.swims = state.swims.filter((x) => x.id !== id);
          save(); closeSheet(true); render(); toast('Skip removed.');
        });
      },
    });
  }

  function openGoalSheet() {
    const cur = state.settings.swimGoal;
    const body = `<p class="muted small">You swim 1 km in about 25:00 now. Pick what to chase. You can switch any time and your swims stay logged.</p>
      <div class="opts" role="radiogroup" aria-label="Swim goal">
        ${Object.values(PS.SWIM_GOALS).map((g) => `<button class="opt" type="button" role="radio" data-goal="${g.id}" aria-checked="${g.id === cur}">
            <span class="o-top"><span class="o-name">${esc(g.name)}</span><span class="o-line">${esc(g.line)}</span></span>
            <span class="o-desc">${esc(g.desc)}</span>
          </button>`).join('')}
      </div>`;
    openSheet({
      title: 'Swim goal',
      closeLabel: 'Close',
      body,
      mount: (el) => {
        el.addEventListener('click', (e) => {
          const b = e.target.closest('[data-goal]');
          if (!b) return;
          state.settings.swimGoal = b.dataset.goal;
          save(); closeSheet(true); render();
          toast(`Goal set: ${PS.SWIM_GOALS[b.dataset.goal].line}.`);
        });
      },
    });
  }

  /* Settings */
  function openSettings() {
    const s = state.settings;
    const chips = (name, sel) => [1, 2, 3, 4, 5, 6, 0].map((d) => `<button class="chip" type="button" data-${name}="${d}" aria-pressed="${sel.includes(d)}" aria-label="${PS.DAY_LONG[d]}">${PS.DAY[d]}</button>`).join('');
    const body = () => `
      <div class="field"><span class="lbl" id="ldL">Lift days</span><div class="chips days" role="group" aria-labelledby="ldL">${chips('ld', s.liftDays)}</div><p class="muted small">Pick two. The first is Squat & Bench, the second is Deadlift & Press.</p></div>
      <div class="field"><span class="lbl" id="swL">Swim day</span><div class="chips days" role="group" aria-labelledby="swL">${chips('sd', [s.swimDay])}</div></div>
      <div class="field"><span class="lbl" id="bbL">Basketball day</span><div class="chips days" role="group" aria-labelledby="bbL">${chips('bd', [s.ballDay])}</div></div>
      <div class="block">
        <div class="field"><span class="lbl">Backup</span><p class="muted small">Your log lives on this phone only. Copy a backup now and then and keep it in Notes. To restore, paste it below.</p></div>
        <div class="acts" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn line" type="button" data-copy>Copy backup</button><button class="btn line" type="button" data-restore>Restore</button></div>
        <textarea class="inp" id="backupBox" aria-label="Backup text" placeholder="Paste a backup here, then tap Restore"></textarea>
        <p class="small muted" id="backupMsg" role="status"></p>
      </div>
      <div class="block">
        <button class="btn danger" type="button" data-reset>Reset to the history from our chat</button>
      </div>
      <div class="about"><img src="${$('.emblem').getAttribute('src')}" alt=""><p>PUSH Strength keeps everything on this device. Nothing is sent anywhere.</p></div>`;
    openSheet({
      title: 'Settings',
      closeLabel: 'Done',
      body: body(),
      mount: (el) => {
        const refresh = () => {
          const sb = $('.sheet-body', el);
          const y = sb.scrollTop;
          sb.innerHTML = body();
          sb.scrollTop = y;
          render();
        };
        el.addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          if (b.dataset.ld != null) {
            const d = +b.dataset.ld;
            if (!s.liftDays.includes(d)) {
              if (d === s.ballDay) { $('#backupMsg', el).textContent = ''; }
              s.liftDays = [s.liftDays[s.liftDays.length - 1], d];
              s.since = T();
              save(); refresh();
              const nb = $(`[data-ld="${d}"]`, el); if (nb) nb.focus({ preventScroll: true });
            }
          } else if (b.dataset.sd != null) {
            s.swimDay = +b.dataset.sd; save(); refresh();
            const nb = $(`[data-sd="${s.swimDay}"]`, el); if (nb) nb.focus({ preventScroll: true });
          } else if (b.dataset.bd != null) {
            s.ballDay = +b.dataset.bd; save(); refresh();
            const nb = $(`[data-bd="${s.ballDay}"]`, el); if (nb) nb.focus({ preventScroll: true });
          } else if (b.hasAttribute('data-copy')) {
            const text = JSON.stringify(state);
            const box = $('#backupBox', el);
            const msg = $('#backupMsg', el);
            const fallback = () => { box.value = text; box.focus(); box.select(); msg.textContent = 'Copy the selected text and keep it somewhere safe.'; };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(() => { msg.textContent = 'Backup copied. Paste it into Notes to keep it.'; }, fallback);
            } else fallback();
          } else if (b.hasAttribute('data-restore')) {
            const box = $('#backupBox', el);
            const msg = $('#backupMsg', el);
            try {
              const parsed = JSON.parse(box.value);
              if (!parsed || parsed.v !== 1 || !Array.isArray(parsed.lifts)) throw new Error('bad');
              state = normalize(parsed);
              save(); closeSheet(true); render(); toast('Backup restored.');
            } catch (err) {
              msg.textContent = 'That text is not a PUSH Strength backup. Paste the whole backup, starting with {"v":1.';
            }
          } else if (b.hasAttribute('data-reset')) {
            if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap again to erase your log and reset'; return; }
            state = PS.seed();
            save(); closeSheet(true); render(); toast('Reset to the history from our chat.');
          }
        });
      },
    });
  }

  /* ---------- toast ---------- */
  let toastTimer = null;
  function toast(msg, undo) {
    const el = $('#toast');
    el.innerHTML = `<span class="msg"></span>${undo ? '<button type="button">Undo</button>' : ''}`;
    $('.msg', el).textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    const hide = () => { el.hidden = true; };
    if (undo) $('button', el).addEventListener('click', () => { hide(); undo(); });
    toastTimer = setTimeout(hide, undo ? 6500 : 3500);
  }

  /* ---------- boot ---------- */
  $$('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  $('#settingsBtn').addEventListener('click', openSettings);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && T() !== renderedDay && !sheet) render();
  });
  window.addEventListener('storage', (e) => { if (e.key === KEY && !sheet) { state = load(); render(); } });
  render();
})();

</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
