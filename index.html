      <span><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>Grind or missed reps</span>
      <span><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 1.6"/></svg>Planned</span>
    </div>`;

  function chartPanel(s, sub, extra) {
    return `<div class="panel chart-panel">
        <div class="chart-head">
          <div class="ch-txt"><h3>${esc(s.title)}</h3><p class="ch-sub">${sub}</p></div>
          <button class="expand" type="button" data-act="expand" data-key="${s.key}" aria-label="Open the ${esc(s.title.toLowerCase())} chart full screen">${ICON.expand}</button>
        </div>
        ${inlineChart(s)}
        ${extra || ''}
        <p class="chart-hint">Tap the chart to see every entry</p>
      </div>`;
  }

  function liftChartHTML(t) {
    const s = seriesFor(liftSel, t);
    if (s.kind === 'pull') {
      const last = s.points[s.points.length - 1];
      return chartPanel(s, `Total reps over 3 sets${last ? ` · Last <b>${last.e.pull.reps.join(' · ')}</b>` : ''}`,
        '<p class="small muted chart-note">Add weight once the first set reaches 10 clean reps.</p>');
    }
    const last = s.points[s.points.length - 1];
    const nd = nextDateFor(liftSel, t);
    const plan = PS.liftPlan(state, liftSel, nd);
    return chartPanel(s, `${last ? `Last <b>${PS.kg(last.y)} kg</b> · ` : ''}Next <b>${PS.kg(plan.w)} kg</b> ${PS.DAY[PS.dow(nd)]} ${PS.shortDate(nd)}`, LEGEND);
  }

  function liftSummary(e) {
    const parts = [];
    const flags = [];
    PS.SESSIONS[e.type].lifts.forEach((k) => {
      const it = e.lifts && e.lifts[k];
      if (!it) return;
      parts.push(`${PS.LIFTS[k].short} ${PS.kg(it.w)}`);
      const v = PS.verdict(k, it);
      if (v === 'miss' || v === 'drop') flags.push(`${PS.LIFTS[k].short}: ${PS.sum(it.reps)}/${it.reps.length * PS.LIFTS[k].reps} reps`);
      else if (v === 'short') flags.push(`${PS.LIFTS[k].short}: ${it.reps.length}/${it.planned} sets`);
      else if (it.effort === 'grind') flags.push(`${PS.LIFTS[k].short}: grind`);
      else if (it.effort === 'easy') flags.push(`${PS.LIFTS[k].short}: easy`);
    });
    if (e.pull && e.pull.reps && PS.sum(e.pull.reps) > 0) parts.push(`Pull-ups ${e.pull.reps.join('·')}`);
    return { s: parts.join(' · '), flags };
  }

  function liftHistoryHTML() {
    const ents = state.lifts.slice().sort(PS.byDate).reverse();
    if (!ents.length) return '<p class="muted">Nothing logged yet.</p>';
    const shown = showAllLifts ? ents : ents.slice(0, 6);
    const rows = shown.map((e) => {
      if (e.status === 'skipped') {
        return `<button class="item skipped" type="button" data-act="edit-lift" data-id="${esc(e.id)}">${dateBlock(e.date)}<span class="what"><span class="t">Skipped</span><span class="n">${PS.SESSIONS[e.type].name}</span></span>${chev}</button>`;
      }
      const sm = liftSummary(e);
      const n = [e.dur ? `${Math.max(1, Math.round(e.dur / 60))} min` : '', sm.flags.join(' · '), e.note ? esc(e.note) : ''].filter(Boolean).join(' · ');
      return `<button class="item" type="button" data-act="edit-lift" data-id="${esc(e.id)}">${dateBlock(e.date)}<span class="what"><span class="t">${PS.SESSIONS[e.type].name}</span><span class="s">${esc(sm.s)}</span>${n ? `<span class="n">${n}</span>` : ''}</span>${chev}</button>`;
    }).join('');
    const more = ents.length > 6 ? `<button class="link more" type="button" data-act="more-lifts">${showAllLifts ? 'Show less' : `Show all ${ents.length}`}</button>` : '';
    return `<div class="list">${rows}</div>${more}`;
  }

  /* ---------- chart data ---------- */
  function seriesFor(key, t) {
    if (key === 'swim') return swimSeries();
    if (key === 'pull') return pullSeries();
    return liftSeries(key, t);
  }

  function liftSeries(k, t) {
    const L = PS.LIFTS[k];
    const h = PS.liftHistory(state, k);
    const nd = nextDateFor(k, t);
    const plan = PS.liftPlan(state, k, nd);
    const points = h.map((e) => {
      const it = e.lifts[k];
      return { x: e.date, y: it.w, hollow: !PS.isClean(k, it), e, it,
        tip: `<b>${PS.kg(it.w)} kg</b>${it.reps.join(' · ')} · ${liftWord(k, it).toLowerCase()} · ${PS.dayDate(e.date)}` };
    });
    return {
      key: k, kind: 'lift', title: L.name, points,
      forecast: points.length ? { x: nd, y: plan.w, label: `Next ${PS.kg(plan.w)}`, plan, tip: `<b>Next ${PS.kg(plan.w)} kg</b>${esc(plan.why)} · ${PS.dayDate(nd)}` } : null,
      fmt: (v) => PS.kg(v), label: (v) => `${PS.kg(v)}`, unit: 'kg', ticks: 'kg',
      empty: 'Log a session to start the line.', aria: `${L.name} working weight per session`,
    };
  }

  function pullSeries() {
    const ph = PS.pullHistory(state);
    const points = ph.map((e) => ({
      x: e.date, y: PS.sum(e.pull.reps), e,
      tip: `<b>${PS.sum(e.pull.reps)} reps</b>${e.pull.reps.join(' · ')}${e.pull.add ? ` · +${PS.kg(e.pull.add)} kg` : ''} · ${PS.dayDate(e.date)}`,
    }));
    return { key: 'pull', kind: 'pull', title: 'Pull-ups', points, forecast: null, fmt: String, label: String, unit: 'reps', ticks: 'int',
      empty: 'Log a session to start the line.', aria: 'Pull-up total reps per session' };
  }

  function swimSeries() {
    const goal = PS.SWIM_GOALS[state.settings.swimGoal] || PS.SWIM_GOALS.faster1k;
    const base = state.settings.swimBase;
    const done = PS.swimsDone(state);
    const common = { key: 'swim', kind: 'swim', forecast: null, goal };
    if (goal.id === 'faster1k') {
      const start = base.time * 1000 / base.dist;
      return Object.assign(common, {
        title: '1 km time', time: true, metric: 't1k',
        points: done.map((e) => {
          const t1k = PS.swimPace(e) * 10;
          return { x: e.date, y: Math.round(t1k), e, tip: `<b>${PS.mmss(t1k)}</b>${e.dist === 1000 ? '1 km' : `${km(e.dist)} in ${PS.mmss(e.time)}`} · ${PS.mmss(PS.swimPace(e))}/100 m · ${PS.dayDate(e.date)}` };
        }),
        refs: [{ y: start, label: `Start ${PS.mmss(start)}` }, { y: goal.time, label: `Goal ${PS.mmss(goal.time)}` }],
        fmt: (v) => PS.mmss(v), label: (v) => PS.mmss(v),
        empty: 'Log your first swim to start the line.', aria: '1 km time per swim',
      });
    }
    if (goal.id === 'stroke') {
      const ws = done.filter((e) => e.strokes > 0);
      return Object.assign(common, {
        title: 'Strokes per length', metric: 'strokes', ticks: 'int',
        points: ws.map((e) => ({ x: e.date, y: e.strokes, e, tip: `<b>${e.strokes} strokes</b>per length · ${PS.dayDate(e.date)}` })),
        refs: ws.length ? [{ y: ws[0].strokes - 3, label: `Goal ${ws[0].strokes - 3}` }] : [],
        fmt: String, label: String,
        empty: 'Add a stroke count when you log a swim.', aria: 'Strokes per length per swim',
      });
    }
    return Object.assign(common, {
      title: 'Distance', metric: 'dist', ticks: 'int',
      points: done.map((e) => ({ x: e.date, y: e.dist, e, tip: `<b>${km(e.dist)}</b>${PS.mmss(e.time)} · ${PS.mmss(PS.swimPace(e))}/100 m · ${PS.dayDate(e.date)}` })),
      refs: [{ y: base.dist, label: `Start ${base.dist} m` }, { y: goal.dist, label: `Goal ${goal.dist} m` }],
      fmt: (v) => `${v}`, label: (v) => `${v} m`,
      empty: 'Log your first swim to start the line.', aria: 'Distance per swim',
    });
  }

  /* ---------- chart drawing ---------- */
  const charts = {};
  let chartSeq = 0;

  function niceTicks(lo, hi, n, mode) {
    const span = hi - lo || Math.abs(hi) * 0.1 || 1;
    const raw = span / (n || 4);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const mults = mode === 'kg' && mag <= 1 ? [1, 2.5, 5, 10] : mode === 'int' ? [1, 2, 5, 10] : [1, 2, 2.5, 5, 10];
    let step = 10 * mag;
    for (const m of mults) { if (raw <= m * mag) { step = m * mag; break; } }
    if (mode === 'int') step = Math.max(1, Math.round(step));
    const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
    const out = [];
    for (let v = a; v <= b + step / 1e3; v += step) out.push(Math.round(v * 1e4) / 1e4);
    if (out.length < 2) out.push(Math.round((a + step) * 1e4) / 1e4);
    return out;
  }
  function timeTicks(lo, hi, n) {
    const raw = (hi - lo || 60) / (n || 4);
    const step = [15, 30, 60, 120, 300, 600].find((s) => raw <= s) || 600;
    const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
    const out = [];
    for (let v = a; v <= b; v += step) out.push(v);
    if (out.length < 2) out.push(a + step);
    return out;
  }

  /* Builds the inside of a chart SVG at W x H. opt.big draws the full-screen
     version with a selected entry (opt.sel: point index, -1 = planned). */
  function chartSVG(s, W, H, opt) {
    const big = !!opt.big;
    const pl = big ? 46 : 38, pr = big ? 24 : 16, pt = big ? 34 : 24, pb = big ? 30 : 26;
    const pts = s.points;
    const fc = s.forecast && pts.length ? s.forecast : null;
    const refs = (s.refs || []).filter(Boolean);
    let xs = pts.map((p) => p.x).concat(fc ? [fc.x] : []);
    const t = T();
    if (!xs.length) xs = [PS.addDays(t, -28), t];
    let x0 = xs.reduce((a, b) => (a < b ? a : b)), x1 = xs.reduce((a, b) => (a > b ? a : b));
    if (x0 === x1) { x0 = PS.addDays(x0, -7); x1 = PS.addDays(x1, 7); }
    const span = PS.diff(x0, x1);
    const padD = Math.max(1, span * 0.05);
    const X = (d) => pl + ((PS.diff(x0, d) + padD) / (span + 2 * padD)) * (W - pl - pr);
    let ys = pts.map((p) => p.y).concat(fc ? [fc.y] : [], refs.map((r) => r.y));
    if (!ys.length) ys = [0, 1];
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if (lo === hi) { lo -= s.time ? 60 : 5; hi += s.time ? 60 : 5; }
    const nT = big && H > 260 ? 5 : 4;
    const ticks = s.time ? timeTicks(lo, hi, nT) : niceTicks(lo, hi, nT, s.ticks);
    lo = ticks[0]; hi = ticks[ticks.length - 1];
    const Y = (v) => pt + (1 - (v - lo) / (hi - lo || 1)) * (H - pt - pb);
    const fmt = s.fmt || String;
    const ax = big ? 'c-axis big' : 'c-axis';
    const f1 = (v) => v.toFixed(1);

    let g = '';
    ticks.forEach((v) => {
      g += `<line class="c-grid" x1="${pl}" x2="${W - pr}" y1="${f1(Y(v))}" y2="${f1(Y(v))}"/>`;
      g += `<text class="${ax}" x="${pl - 8}" y="${f1(Y(v) + 4)}" text-anchor="end">${fmt(v)}</text>`;
    });
    const months = [];
    let m = `${x0.slice(0, 7)}-01`;
    if (m < x0) { const d = PS.parse(m); d.setMonth(d.getMonth() + 1); m = PS.iso(d); }
    while (m <= x1) { months.push(m); const d = PS.parse(m); d.setMonth(d.getMonth() + 1); m = PS.iso(d); }
    const xl = months.length >= 2 ? months.map((d) => [d, PS.MON[PS.parse(d).getMonth()]]) : [[x0, PS.shortDate(x0)], [x1, PS.shortDate(x1)]];
    (pts.length ? xl : []).forEach(([d, label], i) => {
      const anchor = months.length >= 2 ? 'middle' : i === 0 ? 'start' : 'end';
      g += `<text class="${ax}" x="${f1(X(d))}" y="${H - 7}" text-anchor="${anchor}">${label}</text>`;
    });
    refs.forEach((r) => {
      const y = f1(Y(r.y));
      g += `<line class="c-ref" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/>`;
      g += `<text class="c-ref-label${big ? ' big' : ''}" x="${W - pr}" y="${f1(Y(r.y) - 6)}" text-anchor="end">${esc(r.label)}</text>`;
    });

    const hits = [];
    const sel = big ? opt.sel : null;
    if (pts.length) {
      const P = pts.map((p) => [X(p.x), Y(p.y)]);
      const line = P.map((q, i) => `${i ? 'L' : 'M'}${f1(q[0])} ${f1(q[1])}`).join(' ');
      if (P.length > 1) {
        g += `<path class="c-area" d="${line} L${f1(P[P.length - 1][0])} ${f1(Y(lo))} L${f1(P[0][0])} ${f1(Y(lo))} Z"/>`;
        g += `<path class="c-line" d="${line}"/>`;
      }
      const [lx, ly] = P[P.length - 1];
      const fx = fc ? X(fc.x) : 0, fy = fc ? Y(fc.y) : 0;
      let sxy = null;
      if (sel === -1 && fc) sxy = [fx, fy];
      else if (sel != null && sel >= 0 && P[sel]) sxy = P[sel];
      if (sxy) g += `<line class="c-sel" x1="${f1(sxy[0])}" x2="${f1(sxy[0])}" y1="${pt - 12}" y2="${H - pb}"/>`;
      if (fc) {
        g += `<path class="c-fc" d="M${f1(lx)} ${f1(ly)} L${f1(fx)} ${f1(fy)}"/>`;
        g += `<circle class="c-fc-dot${sel === -1 ? ' sel' : ''}" cx="${f1(fx)}" cy="${f1(fy)}" r="${big ? (sel === -1 ? 7.5 : 6) : 5}"/>`;
        hits.push({ cx: fx, cy: fy, i: -1, html: fc.tip });
      }
      P.forEach((q, i) => {
        const on = sel === i;
        const r = big ? (on ? 7.5 : 5.5) : 4.5;
        g += `<circle class="c-dot${pts[i].hollow ? ' hollow' : ''}${on ? ' sel' : ''}" data-i="${i}" cx="${f1(q[0])}" cy="${f1(q[1])}" r="${r}"/>`;
        hits.push({ cx: q[0], cy: q[1], i, html: pts[i].tip });
      });
      const lab = big ? 'c-label big' : 'c-label';
      const clampX = (x) => Math.max(pl + 18, Math.min(W - 18, x));
      const above = (y) => (y - (big ? 16 : 11) < 12 ? y + (big ? 26 : 19) : y - (big ? 16 : 11));
      if (sxy) {
        const txt = sel === -1 ? fc.label : s.label(pts[sel].y);
        g += `<text class="${lab}" x="${f1(clampX(sxy[0]))}" y="${f1(above(sxy[1]))}" text-anchor="middle">${esc(txt)}</text>`;
      }
      const near = (x) => sxy && Math.abs(x - sxy[0]) < (big ? 64 : 0);
      if (fc && sel !== -1 && !near(fx)) {
        const ty = fy <= ly ? fy - (big ? 15 : 11) : fy + (big ? 24 : 19);
        g += `<text class="${lab} dim" x="${f1(Math.min(fx + 6, W - 2))}" y="${f1(ty)}" text-anchor="end">${esc(fc.label)}</text>`;
      }
      const lastI = pts.length - 1;
      const clash = fc && Math.abs(fx - lx) < 72;
      if (sel !== lastI && !clash && !near(lx)) {
        g += `<text class="${lab}${big ? ' dim' : ''}" x="${f1(clampX(lx))}" y="${f1(above(ly))}" text-anchor="middle">${esc(s.label(pts[lastI].y))}</text>`;
      }
    } else {
      g += `<text class="c-empty" x="${(pl + (W - pr)) / 2}" y="${(pt + (H - pb)) / 2 + 4}" text-anchor="middle">${esc(s.empty || 'No data yet')}</text>`;
    }
    if (!big) g += `<line class="c-cross" x1="0" x2="0" y1="${pt - 8}" y2="${H - pb}"/>`;
    hits.sort((a, b) => a.cx - b.cx);
    return { svg: g, hits };
  }

  function inlineChart(s) {
    const id = `ch${++chartSeq}`;
    const W = 340, H = 180;
    const r = chartSVG(s, W, H, { big: false });
    charts[id] = { W, H, hits: r.hits, key: s.key };
    const n = s.points.length;
    const label = `${s.title} chart, ${n} ${n === 1 ? 'entry' : 'entries'}. Opens full screen with a table of every entry.`;
    return `<div class="chart-wrap" data-chart="${id}" role="button" tabindex="0" aria-label="${esc(label)}"><svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${r.svg}</svg><div class="tip" hidden></div></div>`;
  }

  function bindChart(wrap) {
    const meta = charts[wrap.dataset.chart];
    if (!meta) return;
    const svg = $('svg', wrap), tip = $('.tip', wrap), cross = $('.c-cross', svg);
    const near = (clientX) => {
      if (!meta.hits.length) return null;
      const r = svg.getBoundingClientRect();
      const x = ((clientX - r.left) / Math.max(1, r.width)) * meta.W;
      let best = meta.hits[0];
      meta.hits.forEach((h) => { if (Math.abs(h.cx - x) < Math.abs(best.cx - x)) best = h; });
      return best;
    };
    const hide = () => {
      tip.hidden = true;
      if (cross) cross.style.opacity = '0';
      $$('.c-dot.on', svg).forEach((d) => d.classList.remove('on'));
    };
    wrap.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const h = near(e.clientX);
      if (!h) return;
      cross.setAttribute('x1', h.cx); cross.setAttribute('x2', h.cx); cross.style.opacity = '1';
      $$('.c-dot', svg).forEach((d) => d.classList.toggle('on', +d.dataset.i === h.i));
      tip.innerHTML = h.html;
      tip.hidden = false;
      const r = svg.getBoundingClientRect();
      const sx = r.width / meta.W, sy = r.height / meta.H;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      tip.style.left = `${Math.max(tw / 2, Math.min(r.width - tw / 2, h.cx * sx))}px`;
      let top = h.cy * sy - th - 14;
      if (top < -6) top = h.cy * sy + 14;
      tip.style.top = `${top}px`;
    });
    wrap.addEventListener('pointerleave', hide);
    const open = (sel) => { hide(); openViewer(meta.key, sel, wrap.closest('.panel') || wrap); };
    wrap.addEventListener('click', (e) => { const h = near(e.clientX); open(h ? h.i : null); });
    wrap.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(null); } });
  }

  /* ---------- full-screen chart ---------- */
  let viewer = null;
  const LIFT_KEYS = ['squat', 'bench', 'deadlift', 'ohp', 'pull'];

  function statsLine(s) {
    const n = s.points.length;
    if (!n) return s.kind === 'swim' ? 'No swims logged yet' : 'No sessions logged yet';
    if (s.kind === 'lift') {
      const best = Math.max(...s.points.map((p) => p.y));
      return `${plural(n, 'session')} · Best ${PS.kg(best)} kg · Started at ${PS.kg(s.points[0].y)} kg`;
    }
    if (s.kind === 'pull') {
      const best = Math.max(...s.points.map((p) => p.e.pull.reps[0] || 0));
      return `${plural(n, 'session')} · Best first set ${best} · Best total ${Math.max(...s.points.map((p) => p.y))}`;
    }
    if (s.metric === 't1k') return `${plural(n, 'swim')} · Best ${PS.mmss(Math.min(...s.points.map((p) => p.y)))} · Goal ${PS.mmss(s.goal.time)}`;
    if (s.metric === 'strokes') return `${plural(n, 'swim')} · Fewest ${Math.min(...s.points.map((p) => p.y))} strokes`;
    return `${plural(n, 'swim')} · Longest ${km(Math.max(...s.points.map((p) => p.y)))}`;
  }

  function tableHTML(s) {
    if (!s.points.length) return `<p class="v-none">${esc(s.empty)}</p>`;
    let head;
    const rows = [];
    const dotCell = (p) => `<span class="dot${p.hollow ? ' hollow' : ''}" aria-hidden="true"></span>`;
    if (s.kind === 'lift') {
      head = ['Date', 'kg', 'Reps', 'Change'];
      if (s.forecast) {
        const f = s.forecast, p = f.plan;
        rows.push(`<tr data-i="-1" tabindex="-1" class="plan"><td><span class="dot plan" aria-hidden="true"></span>${PS.dayDate(f.x)}<span class="tag">Next</span></td><td class="n">${PS.kg(p.w)}</td><td class="n">${p.sets} × ${p.reps}</td><td class="n">${esc(p.tag)}</td></tr>`);
      }
      for (let i = s.points.length - 1; i >= 0; i--) {
        const p = s.points[i], prev = s.points[i - 1];
        rows.push(`<tr data-i="${i}" tabindex="-1"><td>${dotCell(p)}${PS.dayDate(p.x)}</td><td class="n">${PS.kg(p.it.w)}</td><td class="n">${p.it.reps.join('·')}</td><td class="n">${prev ? changeTxt(p.it.w - prev.it.w) : 'Start'}</td></tr>`);
      }
    } else if (s.kind === 'pull') {
      head = ['Date', 'Sets', 'Total', 'Change'];
      for (let i = s.points.length - 1; i >= 0; i--) {
        const p = s.points[i], prev = s.points[i - 1];
        const add = p.e.pull.add ? ` +${PS.kg(p.e.pull.add)}kg` : '';
        rows.push(`<tr data-i="${i}" tabindex="-1"><td>${dotCell(p)}${PS.dayDate(p.x)}</td><td class="n">${p.e.pull.reps.join('·')}${add}</td><td class="n">${p.y}</td><td class="n">${prev ? changeTxt(p.y - prev.y) : 'Start'}</td></tr>`);
      }
    } else {
      const st = s.points.some((p) => p.e.strokes > 0);
      head = ['Date', 'Dist', 'Time', 'Pace'].concat(st ? ['Strokes'] : []);
      for (let i = s.points.length - 1; i >= 0; i--) {
        const p = s.points[i], e = p.e;
        rows.push(`<tr data-i="${i}" tabindex="-1"><td>${dotCell(p)}${PS.dayDate(p.x)}</td><td class="n">${km(e.dist)}</td><td class="n">${PS.mmss(e.time)}</td><td class="n">${PS.mmss(PS.swimPace(e))}</td>${st ? `<td class="n">${e.strokes || '–'}</td>` : ''}</tr>`);
      }
    }
    return `<table class="v-table"><caption class="sr">${esc(s.title)}, newest first</caption><thead><tr>${head.map((h, j) => `<th scope="col"${j ? ' class="n"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
  }

  function readoutHTML(s, i) {
    if (i == null) return `<p class="r-empty">${esc(s.empty)}</p>`;
    if (s.kind === 'lift' && i === -1) {
      const f = s.forecast, p = f.plan;
      return `<div class="r-top"><span class="r-date">Next · ${PS.dayDate(f.x)}</span><span class="r-chip">${esc(p.tag)}</span></div>
        <div class="r-main"><span class="r-val">${PS.kg(p.w)}<small>kg</small></span><span class="r-sub">${p.sets} × ${p.reps} planned</span></div>
        <p class="r-note">${esc(p.why)}.</p>`;
    }
    const p = s.points[i];
    if (!p) return '';
    const prev = s.points[i - 1];
    if (s.kind === 'lift') {
      const it = p.it;
      const ch = prev ? (it.w === prev.it.w ? 'Same weight' : `${changeTxt(it.w - prev.it.w)} kg`) : 'First session';
      return `<div class="r-top"><span class="r-date">${PS.dayDate(p.x)}</span><span class="r-chip">${ch}</span><button class="link r-edit" type="button" data-vedit="lift|${esc(p.e.id)}">Edit</button></div>
        <div class="r-main"><span class="r-val">${PS.kg(it.w)}<small>kg</small></span><span class="r-sub">${it.reps.join(' · ')} · ${esc(liftWord(s.key, it))}</span></div>
        ${p.e.note ? `<p class="r-note">${esc(p.e.note)}</p>` : ''}`;
    }
    if (s.kind === 'pull') {
      const d = prev ? p.y - prev.y : 0;
      const ch = prev ? (d === 0 ? 'Same total' : `${changeTxt(d)} ${Math.abs(d) === 1 ? 'rep' : 'reps'}`) : 'First session';
      return `<div class="r-top"><span class="r-date">${PS.dayDate(p.x)}</span><span class="r-chip">${ch}</span><button class="link r-edit" type="button" data-vedit="lift|${esc(p.e.id)}">Edit</button></div>
        <div class="r-main"><span class="r-val">${p.y}<small>reps</small></span><span class="r-sub">${p.e.pull.reps.join(' · ')}${p.e.pull.add ? ` · +${PS.kg(p.e.pull.add)} kg` : ' · Bodyweight'}</span></div>`;
    }
    const e = p.e;
    const big = s.metric === 't1k' ? `${PS.mmss(p.y)}<small>per km</small>` : s.metric === 'strokes' ? `${p.y}<small>strokes</small>` : `${e.dist}<small>m</small>`;
    return `<div class="r-top"><span class="r-date">${PS.dayDate(p.x)}</span><span class="r-chip">${PS.mmss(PS.swimPace(e))} /100 m</span><button class="link r-edit" type="button" data-vedit="swim|${esc(e.id)}">Edit</button></div>
      <div class="r-main"><span class="r-val">${big}</span><span class="r-sub">${km(e.dist)} in ${PS.mmss(e.time)}${e.strokes ? ` · ${e.strokes} strokes/length` : ''}</span></div>
      ${e.note ? `<p class="r-note">${esc(e.note)}</p>` : ''}`;
  }

  function openViewer(key, sel, fromEl) {
    closeViewer(true);
    const el = document.createElement('div');
    el.className = 'viewer-wrap';
    el.innerHTML = '<div class="scrim" data-vclose></div><section class="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle"></section>';
    document.body.appendChild(el);
    document.documentElement.classList.add('locked');
    setInert(true);
    viewer = { el, key, startKey: key, sel: null, prevFocus: document.activeElement, scrub: false, ro: null, s: null, hits: [], W: 0, H: 0 };
    viewer.onResize = () => drawViewerChart();
    window.addEventListener('resize', viewer.onResize);
    renderViewer(sel);
    const v = $('.viewer', el);
    zoomIn(v, fromEl);
    if (window.ResizeObserver) { viewer.ro = new ResizeObserver(() => drawViewerChart()); viewer.ro.observe(v); }
    el.addEventListener('click', onViewerClick);
    el.addEventListener('keydown', onViewerKey);
    el.addEventListener('pointerdown', (e) => {
      if (!viewer) return;
      const c = e.target.closest('.v-chart');
      if (!c) return;
      viewer.scrub = true;
      try { c.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      pickAt(e.clientX);
    });
    el.addEventListener('pointermove', (e) => { if (viewer && viewer.scrub) pickAt(e.clientX); });
    const stop = () => { if (viewer) viewer.scrub = false; };
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
    setTimeout(() => { const h = $('#vTitle', el); if (h && viewer && viewer.el === el) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }, 60);
  }

  function zoomIn(v, fromEl) {
    if (!fromEl || reduced) return;
    const a = fromEl.getBoundingClientRect(), b = v.getBoundingClientRect();
    if (!(a.width > 0 && b.width > 0)) return;
    v.style.transformOrigin = '0 0';
    v.style.transform = `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${Math.min(1, a.width / b.width)})`;
    v.style.opacity = '0.4';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      v.style.transition = 'transform .32s cubic-bezier(.2,.8,.2,1), opacity .22s ease-out';
      v.style.transform = '';
      v.style.opacity = '';
    }));
    setTimeout(() => { v.style.transition = ''; v.style.transformOrigin = ''; }, 420);
  }

  function renderViewer(sel) {
    const s = seriesFor(viewer.key, T());
    viewer.s = s;
    const v = $('.viewer', viewer.el);
    const isLift = LIFT_KEYS.includes(viewer.key);
    v.innerHTML = `
      <header class="v-head">
        <div class="v-title"><h2 id="vTitle">${esc(s.title)}</h2><p class="v-stats">${esc(statsLine(s))}</p></div>
        <button class="v-close" type="button" data-vclose aria-label="Close">${ICON.x}</button>
      </header>
      ${isLift ? `<div class="v-switch" role="group" aria-label="Choose a lift">${LIFT_KEYS.map((k) => `<button type="button" data-vkey="${k}" aria-pressed="${k === viewer.key}">${k === 'pull' ? 'Pull-ups' : esc(PS.LIFTS[k].short)}</button>`).join('')}</div>` : ''}
      <div class="v-body">
        <div class="v-left">
          <div class="v-chart" tabindex="0" role="group" aria-label="${esc(s.aria)}. Arrow keys move between entries."></div>
          <div class="v-readout" aria-live="polite"></div>
        </div>
        <div class="v-right">${tableHTML(s)}</div>
      </div>`;
    viewer.sel = null;
    const valid = (i) => i === -1 ? !!s.forecast && s.points.length > 0 : i >= 0 && i < s.points.length;
    const d = s.points.length ? s.points.length - 1 : null;
    selectView(sel != null && valid(sel) ? sel : d, null);
  }

  function drawViewerChart() {
    if (!viewer) return;
    const box = $('.v-chart', viewer.el);
    if (!box) return;
    const W = Math.max(220, Math.floor(box.clientWidth));
    const H = Math.max(140, Math.floor(box.clientHeight));
    const r = chartSVG(viewer.s, W, H, { big: true, sel: viewer.sel });
    viewer.hits = r.hits; viewer.W = W; viewer.H = H;
    box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${r.svg}</svg>`;
  }

  function selectView(i, src) {
    if (!viewer) return;
    viewer.sel = i;
    drawViewerChart();
    const ro = $('.v-readout', viewer.el);
    if (ro) ro.innerHTML = readoutHTML(viewer.s, i);
    const pane = $('.v-right', viewer.el);
    const head = $('.v-table thead', viewer.el);
    let any = false;
    $$('.v-table tbody tr', viewer.el).forEach((tr) => {
      const on = i != null && Number(tr.dataset.i) === i;
      tr.classList.toggle('on', on);
      if (on) { tr.setAttribute('aria-current', 'true'); any = true; } else tr.removeAttribute('aria-current');
      tr.tabIndex = on ? 0 : -1;
      if (on && src !== 'table' && pane) {
        const rt = tr.getBoundingClientRect(), bt = pane.getBoundingClientRect();
        const top = bt.top + (head ? head.offsetHeight : 0);
        if (rt.top < top) pane.scrollTop -= top - rt.top;
        else if (rt.bottom > bt.bottom) pane.scrollTop += rt.bottom - bt.bottom;
      }
    });
    if (!any) { const f = $('.v-table tbody tr', viewer.el); if (f) f.tabIndex = 0; }
  }

  function pickAt(clientX) {
    const c = $('.v-chart', viewer.el);
    if (!c || !viewer.hits.length) return;
    const r = c.getBoundingClientRect();
    const x = ((clientX - r.left) / Math.max(1, r.width)) * viewer.W;
    let best = viewer.hits[0];
    viewer.hits.forEach((h) => { if (Math.abs(h.cx - x) < Math.abs(best.cx - x)) best = h; });
    if (best.i !== viewer.sel) selectView(best.i, 'chart');
  }

  function onViewerClick(e) {
    if (!viewer) return;
    if (e.target.closest('[data-vclose]')) { closeViewer(); return; }
    const kb = e.target.closest('[data-vkey]');
    if (kb) {
      if (kb.dataset.vkey !== viewer.key) { viewer.key = kb.dataset.vkey; renderViewer(null); }
      const nb = $(`[data-vkey="${viewer.key}"]`, viewer.el);
      if (nb) nb.focus({ preventScroll: true });
      return;
    }
    const ed = e.target.closest('[data-vedit]');
    if (ed) {
      const [kind, id] = ed.dataset.vedit.split('|');
      closeViewer(true);
      if (kind === 'swim') editSwim(id); else editLift(id);
      return;
    }
    const tr = e.target.closest('tr[data-i]');
    if (tr) selectView(Number(tr.dataset.i), 'table');
  }

  function onViewerKey(e) {
    if (!viewer) return;
    if (e.key === 'Escape') { e.preventDefault(); closeViewer(); return; }
    if (e.key === 'Tab') { trapTab(e, viewer.el); return; }
    const chartEl = e.target.closest && e.target.closest('.v-chart');
    if (chartEl && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
      e.preventDefault();
      const hs = viewer.hits;
      if (!hs.length) return;
      let j = hs.findIndex((h) => h.i === viewer.sel);
      if (e.key === 'ArrowLeft') j = j < 0 ? hs.length - 1 : Math.max(0, j - 1);
      else if (e.key === 'ArrowRight') j = j < 0 ? 0 : Math.min(hs.length - 1, j + 1);
      else j = e.key === 'Home' ? 0 : hs.length - 1;
      selectView(hs[j].i, 'chart');
      return;
    }
    const tr = e.target.closest && e.target.closest('tr[data-i]');
    if (!tr) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectView(Number(tr.dataset.i), 'table'); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const nx = e.key === 'ArrowDown' ? tr.nextElementSibling : tr.previousElementSibling;
      if (nx) { selectView(Number(nx.dataset.i), 'table'); nx.focus(); }
    }
  }

  function closeViewer(instant) {
    if (!viewer) return;
    const { el, prevFocus, ro, onResize, startKey, key } = viewer;
    viewer = null;
    if (ro) ro.disconnect();
    window.removeEventListener('resize', onResize);
    document.documentElement.classList.remove('locked');
    setInert(false);
    if (instant || reduced) el.remove();
    else { el.classList.add('closing'); setTimeout(() => el.remove(), 200); }
    if (key !== startKey && LIFT_KEYS.includes(key)) {
      liftSel = key;
      render();
      const cw = $('.chart-wrap', main);
      if (cw && !instant) cw.focus({ preventScroll: true });
      return;
    }
    if (prevFocus && prevFocus.isConnected && prevFocus.focus) prevFocus.focus({ preventScroll: true });
  }

  function trapTab(e, root) {
    const f = $$('button:not([disabled]), input, textarea, [tabindex="0"]', root).filter((x) => x.offsetParent !== null || x.getClientRects().length);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }

  /* ---------- 5:30 mornings ---------- */
  const pctOf = (a, b) => (b ? Math.round((a / b) * 100) : null);
  const HM_LEGEND = `<div class="legend hm-legend">
      <span><i class="hm-c done"></i>Done</span>
      <span><i class="hm-c miss"></i>Missed or skipped</span>
      <span><i class="hm-c pre"></i>Not tracked</span>
    </div>`;

  function heatmapHTML(cols, big, fit) {
    let labels = '';
    cols.forEach((c, i) => {
      for (let k = 0; k < 7; k++) {
        const d = PS.addDays(c.start, k);
        if (d.slice(8) === '01') { labels += `<span class="hm-m" style="grid-column:${i + 2}">${PS.MON[PS.parse(d).getMonth()]}</span>`; break; }
      }
    });
    if (!/grid-column:[234]"/.test(labels)) labels = `<span class="hm-m" style="grid-column:2">${PS.MON[PS.parse(cols[0].start).getMonth()]}</span>${labels}`;
    let cells = '';
    cols[0].cells.forEach((c0, r) => { cells += `<span class="hm-d" style="grid-row:${r + 2}">${PS.DAY[PS.dow(c0.d)].charAt(0)}</span>`; });
    cols.forEach((c, i) => {
      c.cells.forEach((cell, r) => { cells += `<i class="hm-c ${cell.st}" style="grid-row:${r + 2};grid-column:${i + 2}"></i>`; });
    });
    return `<div class="hm${big ? ' big' : ''}${fit ? ' fit' : ''}" style="--cols:${cols.length}" aria-hidden="true">${labels}${cells}</div>`;
  }

  function viewMornings(t) {
    const due = PS.morningDue(state, t);
    const st = PS.morningStats(state, t);
    const w = whenLabel(due.due, t);
    const card = `<article class="card${animateCard ? ' enter' : ''}" tabindex="0" aria-label="Run and punching bag, ${esc(w.text)}. Swipe right when it's done, left to skip.">
        <div class="card-top"><span class="when">${esc(w.text)} · 5:30</span>${st.streak ? `<span class="pill solid">${st.streak} in a row</span>` : ''}</div>
        <h3>Run + Bag</h3>
        <div class="rows">
          <div class="row"><span class="name">Run</span><span class="val">2<small>km</small></span><span class="meta">About 10 minutes</span></div>
          <div class="row"><span class="name">Punching bag</span><span class="val">5<small>min</small></span><span class="meta">Wrap your hands. Keep your wrists straight and land on the first two knuckles.</span></div>
        </div>
      </article>`;
    const mRate = pctOf(st.month.done, st.month.possible);
    const sub = st.possible
      ? `${pctOf(st.total, st.possible)}% done since ${PS.shortDate(st.start)} · Best streak ${st.best}`
      : `Tracking since ${PS.shortDate(st.start)}. Check off your first morning to start.`;
    const aria = `Last 20 weeks: ${st.total} of ${st.possible} mornings done. Opens your full history.`;
    return `
      <section aria-label="Next morning session">
        <div class="swipe">${trackHTML('Done', 'Skip')}${card}</div>
        ${actionsHTML('Done', 'Skip')}
      </section>
      <section aria-label="Mornings at a glance">
        <div class="stats">
          <div class="stat"><div class="v">${st.streak}</div><div class="l">In a row</div></div>
          <div class="stat"><div class="v">${st.week.done}<small>/${st.week.of}</small></div><div class="l">This week</div></div>
          <div class="stat"><div class="v">${mRate == null ? '–' : `${mRate}<small>%</small>`}</div><div class="l">This month</div></div>
        </div>
      </section>
      <section aria-labelledby="mLongH">
        ${secHead('<span id="mLongH">Long term</span>', '<span class="aside">Last 20 weeks</span>')}
        <div class="panel chart-panel">
          <div class="chart-head">
            <div class="ch-txt"><h3>${st.total} done</h3><p class="ch-sub">${sub}</p></div>
            <button class="expand" type="button" data-act="expand-m" aria-label="Open your full morning history">${ICON.expand}</button>
          </div>
          <div class="hm-wrap" role="button" tabindex="0" data-act="expand-m" aria-label="${esc(aria)}">${heatmapHTML(PS.morningGrid(state, t, 20), false)}</div>
          ${HM_LEGEND}
          <p class="chart-hint">Tap to see every week and month</p>
        </div>
      </section>
      <section aria-labelledby="calH">${calendarHTML(t, 'morning')}</section>`;
  }

  function openMorningViewer(fromEl) {
    closeViewer(true);
    const t = T();
    const st = PS.morningStats(state, t);
    const wdRows = PS.morningWeekdays(state, t).map((x) => {
      const p = pctOf(x.done, x.possible);
      return `<div class="wd-row"><span>${PS.DAY[x.d]}</span><span class="wd-bar"><i style="width:${p || 0}%"></i></span><b>${p == null ? '–' : `${p}%`}</b></div>`;
    }).join('');
    const mRows = PS.morningMonths(state, t).map((mo) => {
      const [yy, mm] = mo.ym.split('-').map(Number);
      const p = pctOf(mo.done, mo.possible);
      return `<tr><td>${PS.MON_LONG[mm - 1]} ${yy}${mo.ym === t.slice(0, 7) ? '<span class="tag">So far</span>' : ''}</td><td class="n">${mo.done} of ${mo.possible}</td><td class="n">${p == null ? '–' : `${p}%`}</td></tr>`;
    }).join('');
    const el = document.createElement('div');
    el.className = 'viewer-wrap';
    el.innerHTML = `<div class="scrim" data-vclose></div>
      <section class="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle">
        <header class="v-head">
          <div class="v-title"><h2 id="vTitle">Mornings</h2><p class="v-stats">${st.total} done · ${st.possible ? `${pctOf(st.total, st.possible)}% since ${PS.shortDate(st.start)}` : `Since ${PS.shortDate(st.start)}`} · Best streak ${st.best}</p></div>
          <button class="v-close" type="button" data-vclose aria-label="Close">${ICON.x}</button>
        </header>
        <div class="v-body">
          <div class="v-left m-left">
            <div class="hm-scroll" role="img" aria-label="Every week of mornings since you started. The table lists every month."></div>
            ${HM_LEGEND}
            <div class="wd"><p class="lbl">By weekday</p>${wdRows}</div>
          </div>
          <div class="v-right"><table class="v-table static"><caption class="sr">Mornings by month, newest first</caption><thead><tr><th scope="col">Month</th><th scope="col" class="n">Done</th><th scope="col" class="n">Rate</th></tr></thead><tbody>${mRows}</tbody></table></div>
        </div>
      </section>`;
    const prevFocus = document.activeElement;
    document.body.appendChild(el);
    document.documentElement.classList.add('locked');
    setInert(true);
    viewer = { el, key: 'mornings', startKey: 'mornings', sel: null, prevFocus, scrub: false, ro: null, s: null, hits: [], onResize: () => fillMorningGrid(el) };
    window.addEventListener('resize', viewer.onResize);
    el.addEventListener('click', onViewerClick);
    el.addEventListener('keydown', onViewerKey);
    fillMorningGrid(el);
    zoomIn($('.viewer', el), fromEl);
    setTimeout(() => { const h = $('#vTitle', el); if (h && viewer && viewer.el === el) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } }, 60);
  }

  /* Shows as many weeks as fit the width, or every tracked week (scrollable) if that is more. */
  function fillMorningGrid(el) {
    const sc = $('.hm-scroll', el);
    if (!sc) return;
    const t = T();
    const st = PS.morningStats(state, t);
    const tracked = Math.round(PS.diff(PS.morningWeekStart(state.settings, st.start), PS.morningWeekStart(state.settings, t)) / 7) + 1;
    const fit = Math.max(8, Math.min(60, Math.floor((sc.clientWidth - 30) / 17)));
    const weeks = Math.max(fit, tracked);
    sc.innerHTML = heatmapHTML(PS.morningGrid(state, t, weeks), true, weeks <= fit);
    sc.scrollLeft = sc.scrollWidth;
  }

  function logMorning() {
    const t = T();
    const due = PS.morningDue(state, t);
    const date = due.due <= t ? due.due : t;
    let e = state.mornings.find((x) => x.date === date);
    const prevStatus = e ? e.status : null;
    if (e) e.status = 'done';
    else { e = { id: uid(), date, status: 'done' }; state.mornings.push(e); }
    calMonthM = date.slice(0, 7);
    save();
    animateCard = true;
    render();
    const st = PS.morningStats(state, T());
    toast(st.streak > 1 ? `Morning done. ${st.streak} in a row.` : 'Morning done.', () => {
      if (prevStatus) e.status = prevStatus;
      else state.mornings = state.mornings.filter((x) => x !== e);
      save(); render();
    });
  }

  /* ---------- swim ---------- */
  function viewSwim(t) {
    const ft = swimFocusTip();
    const due = swimDue(t);
    const plan = PS.swimPlan(state);
    const prog = PS.swimProgress(state);
    const goal = plan.goal;
    const w = whenLabel(due.due, t);
    const card = `<article class="card${animateCard ? ' enter' : ''}" tabindex="0" aria-label="Swim, ${esc(w.text)}. Swipe right if you swam, left to skip.">
        <div class="card-top"><span class="when">${esc(w.text)}</span>${due.late ? '<span class="pill solid">Log it</span>' : ''}</div>
        <h3>${km(plan.dist)} swim</h3>
        <div class="rows">
          <div class="row"><span class="name">${esc(plan.aimLabel)}</span><span class="val">${esc(plan.aimValue)}</span><span class="meta">${esc(plan.sub)}</span></div>
          <div class="row"><span class="name">Focus</span><span class="val word">${esc(ft.drill.name)}</span><span class="meta cue">${esc(ft.drill.short)}</span><span class="meta"><button class="link card-link" type="button" data-act="tip" data-tip="${ft.id}">How to do it →</button></span></div>
        </div>
      </article>`;
    const s = swimSeries();
    const best = s.points.length ? statsLine(s).split(' · ').slice(1).join(' · ') : 'Your swims will plot here';
    return `
      <section aria-label="Next swim">
        <div class="swipe">${trackHTML('Swam', 'Skip')}${card}</div>
        ${actionsHTML('Swam', 'Skip')}
      </section>
      <section aria-labelledby="goalH">
        ${secHead('<span id="goalH">Goal</span>', '<button class="link" type="button" data-act="goal">Change goal</button>')}
        <div class="panel">
          <div class="goal-top"><span class="goal-name">${esc(goal.name)}</span><span class="goal-line">${esc(goal.line)}</span></div>
          <div class="bar" role="progressbar" aria-label="Progress toward ${esc(goal.line)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(prog.pct * 100)}"><i style="width:${Math.round(prog.pct * 100)}%"></i></div>
          <div class="goal-nums"><span>Start <b>${esc(prog.from)}</b></span><span>${esc(prog.nowLabel)} <b>${esc(prog.now)}</b></span><span>Goal <b>${esc(prog.to)}</b></span></div>
          <p class="goal-desc">${esc(goal.desc)}</p>
        </div>
      </section>
      <section aria-labelledby="swimChartH">
        ${secHead('<span id="swimChartH">Progress</span>', `<span class="aside">${swimChartAside(goal)}</span>`)}
        ${chartPanel(s, esc(best))}
      </section>
      ${techniqueHTML()}
      <section aria-labelledby="swimHistH">
        ${secHead('<span id="swimHistH">History</span>', `<span class="aside">${plural(PS.swimsDone(state).length, 'swim')}</span>`)}
        ${swimHistoryHTML()}
      </section>`;
  }

  /* The drill shown on the swim card: one you picked, or the next in the rotation. */
  function swimFocusTip() {
    const pinned = state.settings.swimFocus && TIP[state.settings.swimFocus];
    if (pinned && pinned.drill) return pinned;
    if (state.settings.swimGoal === 'stroke' && TIP.glide) return TIP.glide;
    return TIP[FOCUS_ROTATION[PS.swimsDone(state).length % FOCUS_ROTATION.length]];
  }

  function techniqueHTML() {
    const groups = (window.PS_TIP_GROUPS || []).map((g) => {
      const items = TIPS.filter((x) => x.group === g.id).map((x) => {
        const badge = x.step
          ? `<span class="tip-n" aria-hidden="true">${x.step}</span>`
          : `<span class="tip-ic" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${x.icon || ''}</svg></span>`;
        return `<button class="item tip-item" type="button" data-act="tip" data-tip="${x.id}">${badge}<span class="what"><span class="t">${esc(x.name)}</span><span class="s">${esc(x.cue)}</span></span>${chev}</button>`;
      }).join('');
      return `<h3 class="tip-group">${esc(g.name)}</h3><div class="list tips">${items}</div>`;
    }).join('');
    return `<section aria-labelledby="techH">
        ${secHead('<span id="techH">Technique</span>', '<span class="aside">Tap for details</span>')}
        ${groups}
      </section>`;
  }

  /* Numbers that depend on the next swim, used in the pacing tips. */
  function swimCtx() {
    const plan = PS.swimPlan(state);
    const per100 = (plan.aim / plan.dist) * 100;
    const goal = plan.goal;
    const g100 = goal.id === 'faster1k' ? goal.time / 10 : goal.id === 'combo' ? goal.pace : Math.max(60, per100 - 5);
    return { aim: PS.mmss(plan.aim), dist: km(plan.dist), per100: PS.mmss(per100), perLen: Math.round(per100 / 4), goal100: PS.mmss(g100) };
  }

  function tipBodyHTML(x) {
    const how = typeof x.how === 'function' ? x.how(swimCtx()) : x.how;
    const steps = TIPS.filter((y) => y.step);
    const cycle = x.step ? `<div class="cycle" role="group" aria-label="Breaststroke, step by step">${steps.map((y) => `<button type="button" data-tipgo="${y.id}"${y.id === x.id ? ' aria-current="step"' : ''}><b>${y.step}</b>${esc(y.name)}</button>`).join('')}</div>` : '';
    const pinned = state.settings.swimFocus === x.id;
    return `${cycle}
      <p class="tip-cue">${esc(x.cue)}</p>
      <div class="tip-sec"><h3>Why it matters</h3><p>${esc(x.why)}</p></div>
      <div class="tip-sec"><h3>How to do it</h3><ol class="tip-how">${how.map((y) => `<li>${esc(y)}</li>`).join('')}</ol></div>
      ${x.feel ? `<div class="tip-sec"><h3>What it should feel like</h3><p>${esc(x.feel)}</p></div>` : ''}
      ${x.mistakes ? `<div class="tip-sec"><h3>Common mistakes</h3><ul class="tip-mis">${x.mistakes.map(([m, f]) => `<li><b>${esc(m)}</b><span>${esc(f)}</span></li>`).join('')}</ul></div>` : ''}
      ${x.extra ? `<div class="tip-sec"><h3>Next step</h3><p>${esc(x.extra)}</p></div>` : ''}
      ${x.note ? `<p class="tip-note">${esc(x.note)}</p>` : ''}
      ${x.drill ? `<div class="tip-drill"><p class="lbl">Drill</p><h3>${esc(x.drill.name)}</h3><p>${esc(x.drill.how)}</p>
        <button class="btn ${pinned ? 'solid' : 'line'}" type="button" data-focus="${x.id}" aria-pressed="${pinned}">${pinned ? 'Next swim’s focus ✓' : 'Make it my next swim’s focus'}</button></div>` : ''}`;
  }
  function tipFootHTML(x) {
    const i = TIPS.indexOf(x);
    const prev = TIPS[i - 1], next = TIPS[i + 1];
    return `${prev ? `<button class="btn line" type="button" data-tipgo="${prev.id}">← ${esc(prev.short || prev.name)}</button>` : ''}${next ? `<button class="btn solid" type="button" data-tipgo="${next.id}">${esc(next.short || next.name)} →</button>` : ''}`;
  }

  function openTipSheet(id) {
    let cur = TIP[id] || TIPS[0];
    if (!cur) return;
    openSheet({
      title: esc(cur.name),
      closeLabel: 'Close',
      body: tipBodyHTML(cur),
      foot: tipFootHTML(cur),
      mount: (el) => {
        const show = (nid) => {
          if (!TIP[nid]) return;
          cur = TIP[nid];
          const h = $('#sheetTitle', el);
          h.textContent = cur.name;
          const body = $('.sheet-body', el);
          body.innerHTML = tipBodyHTML(cur);
          body.scrollTop = 0;
          $('.sheet-foot', el).innerHTML = tipFootHTML(cur);
          h.focus({ preventScroll: true });
        };
        el.addEventListener('click', (e) => {
          const g = e.target.closest('[data-tipgo]');
          if (g) { show(g.dataset.tipgo); return; }
          const f = e.target.closest('[data-focus]');
          if (!f) return;
          state.settings.swimFocus = state.settings.swimFocus === f.dataset.focus ? null : f.dataset.focus;
          save();
          render();
          const body = $('.sheet-body', el);
          const y = body.scrollTop;
          body.innerHTML = tipBodyHTML(cur);
          body.scrollTop = y;
          const nb = $('[data-focus]', el);
          if (nb) nb.focus({ preventScroll: true });
        });
      },
    });
  }

  function swimChartAside(goal) {
    if (goal.id === 'faster1k') return 'Lower is faster';
    if (goal.id === 'stroke') return 'Fewer is smoother';
    return 'Metres per swim';
  }

  function swimHistoryHTML() {
    const ents = state.swims.slice().sort(PS.byDate).reverse();
    if (!ents.length) return '<p class="muted small">Your swims will show up here. Swipe the card above after Thursday’s swim.</p>';
    const shown = showAllSwims ? ents : ents.slice(0, 6);
    const rows = shown.map((e) => {
      if (e.status === 'skipped') {
        return `<button class="item skipped" type="button" data-act="edit-swim" data-id="${esc(e.id)}">${dateBlock(e.date)}<span class="what"><span class="t">Skipped</span></span>${chev}</button>`;
      }
      const sub = `${PS.mmss(PS.swimPace(e))} per 100 m${e.strokes ? ` · ${e.strokes} strokes/length` : ''}`;
      const fx = e.focus && TIP[e.focus] && TIP[e.focus].drill ? `Focus: ${TIP[e.focus].drill.name}` : '';
      const n = [fx, e.note || ''].filter(Boolean).join(' · ');
      return `<button class="item" type="button" data-act="edit-swim" data-id="${esc(e.id)}">${dateBlock(e.date)}<span class="what"><span class="t">${km(e.dist)} · ${PS.mmss(e.time)}</span><span class="s">${sub}</span>${n ? `<span class="n">${esc(n)}</span>` : ''}</span>${chev}</button>`;
    }).join('');
    const more = ents.length > 6 ? `<button class="link more" type="button" data-act="more-swims">${showAllSwims ? 'Show less' : `Show all ${ents.length}`}</button>` : '';
    return `<div class="list">${rows}</div>${more}`;
  }

  /* ---------- basketball ---------- */
  function viewBall(t) {
    const due = ballDue(t);
    const st = PS.ballStats(state, t);
    const w = whenLabel(due.due, t);
    const card = `<article class="card${animateCard ? ' enter' : ''}" tabindex="0" aria-label="Basketball, ${esc(w.text)}. Swipe right if you played, left if you sat it out.">
        <div class="card-top"><span class="when">${esc(w.text)}</span>${due.late ? '<span class="pill solid">Log it</span>' : ''}</div>
        <h3>Basketball</h3>
        <div class="rows"><div class="row"><span class="name">Played?</span><span class="val word">✓</span><span class="meta">Swipe right to check it off. That's all it takes.</span></div></div>
        <div class="fuel" aria-label="Game-day fuel">
          <div><b>2.5–3 h before</b><span>Biggest meal of the day. Carb-forward, light on fat.</span></div>
          <div><b>30–45 min before</b><span>A banana or a few dates if you need a top-up.</span></div>
          <div><b>All afternoon</b><span>Sip water with electrolytes.</span></div>
        </div>
      </article>`;
    return `
      <section aria-label="Next game">
        <div class="swipe">${trackHTML('Played', 'Skip')}${card}</div>
        ${actionsHTML('Played', 'Skip')}
      </section>
      <section aria-label="Games played">
        <div class="stats">
          <div class="stat"><div class="v">${st.month}</div><div class="l">This month</div></div>
          <div class="stat"><div class="v">${st.year}</div><div class="l">This year</div></div>
          <div class="stat"><div class="v">${st.streak}</div><div class="l">Week streak</div></div>
        </div>
      </section>
      <section aria-labelledby="calH">${calendarHTML(t, 'ball')}</section>`;
  }

  function calendarHTML(t, kind) {
    const isM = kind === 'morning';
    const month = isM ? calMonthM : calMonth;
    const [y, m] = month.split('-').map(Number);
    const first = `${month}-01`;
    const lead = (PS.dow(first) + 6) % 7;
    const daysIn = new Date(y, m, 0).getDate();
    const byDate = {};
    (isM ? state.mornings : state.ball).forEach((e) => { byDate[e.date] = e.status; });
    const sched = (date) => (isM ? PS.isMorningDay(state.settings, date) : PS.dow(date) === state.settings.ballDay);
    const word = isM ? 'done' : 'played';
    const heads = [1, 2, 3, 4, 5, 6, 0].map((d) => `<span class="dh${sched(PS.addDays('2026-10-12', (d + 6) % 7)) ? ' gd' : ''}" aria-hidden="true">${PS.DAY[d].charAt(0)}</span>`).join('');
    let cells = '';
    for (let i = 0; i < lead; i++) cells += '<span aria-hidden="true"></span>';
    for (let d = 1; d <= daysIn; d++) {
      const date = `${month}-${String(d).padStart(2, '0')}`;
      const st = byDate[date];
      const cls = ['day'];
      if (sched(date)) cls.push('gd');
      if (st === 'done') cls.push('played');
      if (st === 'skipped') cls.push('skipped');
      if (date === t) cls.push('today');
      const label = `${PS.DAY_LONG[PS.dow(date)]} ${PS.shortDate(date)}${st === 'done' ? `, ${word}` : st === 'skipped' ? ', skipped' : ''}`;
      cells += `<button class="${cls.join(' ')}" type="button" data-act="day" data-kind="${kind}" data-date="${date}" aria-label="${label}" aria-pressed="${st === 'done'}"${date > t ? ' disabled' : ''}>${d}</button>`;
    }
    const thisMonth = t.slice(0, 7);
    return `<div class="cal-head"><span class="m" id="calH">${PS.MON_LONG[m - 1]} ${y}</span>
        <div class="cal-nav">
          <button type="button" data-act="cal-prev" data-kind="${kind}" aria-label="Previous month"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>
          <button type="button" data-act="cal-next" data-kind="${kind}" aria-label="Next month"${month >= thisMonth ? ' disabled' : ''}><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
        </div></div>
      <div class="cal" role="group" aria-label="${isM ? 'Mornings' : 'Games'} in ${PS.MON_LONG[m - 1]}">${heads}${cells}</div>
      <div class="cal-key"><span><i class="p"></i>${isM ? 'Done' : 'Played'}</span><span><i class="t"></i>Today</span><span>${isM ? 'Tap a day to check it off or undo it' : 'Tap a day to add or remove a game'}</span></div>`;
  }

  /* ---------- actions ---------- */
  function skipLift() {
    const t = T();
    const nl = PS.nextLift(state, t);
    const e = { id: uid(), date: nl.due > t ? nl.due : t, type: nl.type, status: 'skipped' };
    state.lifts.push(e);
    save();
    animateCard = true;
    render();
    const n2 = PS.nextLift(state, t);
    const day = PS.DAY_LONG[PS.dow(n2.due)];
    const msg = n2.type === nl.type ? `Skipped. ${PS.SESSIONS[nl.type].name} moves to ${day}.` : `Skipped. Next up is ${PS.SESSIONS[n2.type].name} on ${day}.`;
    toast(msg, () => { state.lifts = state.lifts.filter((x) => x.id !== e.id); save(); render(); });
  }

  const dueFor = (kind, t) => (kind === 'swims' ? swimDue(t) : kind === 'ball' ? ballDue(t) : PS.morningDue(state, t));
  function skipWeekly(kind) {
    const t = T();
    const due = dueFor(kind, t);
    const e = { id: uid(), date: due.due, status: 'skipped' };
    state[kind].push(e);
    save();
    animateCard = true;
    render();
    const nx = dueFor(kind, t);
    const noun = kind === 'swims' ? 'Swim' : kind === 'ball' ? 'Game' : 'Morning';
    toast(`${noun} skipped. Next one is ${PS.DAY_LONG[PS.dow(nx.due)]} ${PS.shortDate(nx.due)}.`, () => {
      state[kind] = state[kind].filter((x) => x.id !== e.id); save(); render();
    });
  }

  function logGame() {
    const t = T();
    const due = ballDue(t);
    const e = { id: uid(), date: due.due <= t ? due.due : t, status: 'done' };
    state.ball.push(e);
    calMonth = e.date.slice(0, 7);
    save();
    animateCard = true;
    render();
    toast(`Game logged for ${PS.DAY_LONG[PS.dow(e.date)]}.`, () => { state.ball = state.ball.filter((x) => x.id !== e.id); save(); render(); });
  }

  function toggleDay(kind, date) {
    const arr = state[kind === 'morning' ? 'mornings' : 'ball'];
    const i = arr.findIndex((e) => e.date === date);
    if (i >= 0 && arr[i].status === 'done') arr.splice(i, 1);
    else if (i >= 0) arr[i].status = 'done';
    else arr.push({ id: uid(), date, status: 'done' });
    save();
    render();
    const btn = $(`.day[data-date="${date}"]`, main);
    if (btn) btn.focus({ preventScroll: true });
  }

  function savedToast(e) {
    const n2 = PS.nextLift(state, T());
    const next = PS.SESSIONS[n2.type].lifts.map((k) => `${PS.LIFTS[k].short} ${PS.kg(PS.liftPlan(state, k, n2.due).w)}`).join(' · ');
    toast(`Saved. Next: ${PS.DAY_LONG[PS.dow(n2.due)]}, ${next}.`, () => { state.lifts = state.lifts.filter((x) => x.id !== e.id); save(); render(); });
  }

  main.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || !main.contains(b)) return;
    const act = b.dataset.act;
    if (act === 'done' && swipeCtl) swipeCtl.fly(1);
    else if (act === 'skip' && swipeCtl) swipeCtl.fly(-1);
    else if (act === 'start') openWorkout();
    else if (act === 'expand') openViewer(b.dataset.key, null, b.closest('.panel'));
    else if (act === 'sel') { liftSel = b.dataset.key; render(); const nb = $(`.tile[data-key="${liftSel}"]`, main); if (nb) nb.focus({ preventScroll: true }); }
    else if (act === 'more-lifts') { showAllLifts = !showAllLifts; render(); }
    else if (act === 'more-swims') { showAllSwims = !showAllSwims; render(); }
    else if (act === 'edit-lift') editLift(b.dataset.id);
    else if (act === 'edit-swim') editSwim(b.dataset.id);
    else if (act === 'goal') openGoalSheet();
    else if (act === 'tip') openTipSheet(b.dataset.tip);
    else if (act === 'day') toggleDay(b.dataset.kind, b.dataset.date);
    else if (act === 'expand-m') openMorningViewer(b.closest('.panel') || b);
    else if (act === 'cal-prev' || act === 'cal-next') {
      const isM = b.dataset.kind === 'morning';
      const d = PS.parse(`${isM ? calMonthM : calMonth}-01`);
      d.setMonth(d.getMonth() + (act === 'cal-prev' ? -1 : 1));
      if (isM) calMonthM = PS.iso(d).slice(0, 7); else calMonth = PS.iso(d).slice(0, 7);
      render();
      const nb = $(`[data-act="${act}"]`, main);
      if (nb && !nb.disabled) nb.focus({ preventScroll: true });
    } else if (act === 'tip-yes') {
      const tip = PS.liftDayTip(state);
      if (tip) {
        state.settings.liftDays = tip.days;
        state.settings.since = T();
        save(); render();
        toast(`Lift days are now ${tip.days.map((d) => PS.DAY_LONG[d]).join(' and ')}.`);
      }
    } else if (act === 'tip-no') {
      state.settings.tipOff = T();
      save(); render();
    }
  });

  main.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) {
      e.preventDefault();
      e.target.click();
    }
  });

  /* ---------- workout mode ---------- */
  let wo = loadWorkout();
  let woEl = null;
  let woTimer = null;
  let woDialog = false;
  let woDiscardArmed = false;
  let woMsg = '';
  let lastPip = null;
  let actx = null;
  let wakeLock = null;

  function loadWorkout() {
    try {
      const raw = localStorage.getItem(WKEY);
      if (raw) {
        const w = JSON.parse(raw);
        if (w && w.v === 1 && Array.isArray(w.steps) && w.steps.length && PS.SESSIONS[w.type]) return w;
      }
    } catch (e) { /* ignore */ }
    return null;
  }
  function saveWorkout() {
    try { if (wo) localStorage.setItem(WKEY, JSON.stringify(wo)); else localStorage.removeItem(WKEY); } catch (e) { /* ignore */ }
  }

  function buildWorkout() {
    const t = T();
    const nl = PS.nextLift(state, t);
    const sess = PS.SESSIONS[nl.type];
    const steps = [];
    const w = {};
    sess.lifts.forEach((k) => {
      const p = PS.liftPlan(state, k, nl.due);
      w[k] = p.w;
      const warm = PS.warmups(k, p.w);
      warm.forEach(([x, r], i) => steps.push({ k, kind: 'warm', n: i + 1, of: warm.length, w: x, reps: r }));
      for (let i = 0; i < p.sets; i++) steps.push({ k, kind: 'work', n: i + 1, of: p.sets, reps: p.reps });
    });
    const pp = PS.pullPlan(state);
    for (let i = 0; i < 3; i++) steps.push({ k: 'pull', kind: 'work', n: i + 1, of: 3, reps: pp.reps[i] || pp.reps[pp.reps.length - 1] || 5 });
    const now = Date.now();
    return { v: 1, type: nl.type, started: now, touched: now, steps, i: 0, phase: 'set', restEnd: 0, restTotal: 0, restOver: 0, last: -1, done: {}, effort: {}, w, add: pp.add || 0, pending: null };
  }

  const liftName = (k) => (k === 'pull' ? 'Pull-ups' : PS.LIFTS[k].name);
  const stepWeight = (st) => (st.kind === 'warm' ? st.w : wo.w[st.k]);
  function restFor(st) {
    const r = state.settings.rest;
    if (st.kind === 'warm') return r.warm;
    return st.k === 'pull' ? r.pull : r.work;
  }
  function workIdx(k) {
    const out = [];
    wo.steps.forEach((s, i) => { if (s.k === k && s.kind === 'work') out.push(i); });
    return out;
  }
  function stepLine(st) {
    const what = `${st.kind === 'warm' ? 'Warm-up' : 'Set'} ${st.n} of ${st.of}`;
    if (st.k === 'pull') return `${liftName(st.k)} · ${what} · ${wo.add ? `+${PS.kg(wo.add)} kg, ` : ''}max reps`;
    return `${liftName(st.k)} · ${what} · ${PS.kg(stepWeight(st))} kg × ${st.reps}`;
  }

  function workoutModel() {
    const lifts = {};
    PS.SESSIONS[wo.type].lifts.forEach((k) => {
      const idx = workIdx(k);
      const reps = idx.filter((i) => wo.done[i] != null).map((i) => wo.done[i]);
      if (reps.length) lifts[k] = { w: wo.w[k], reps, effort: wo.effort[k] || 'clean', planned: idx.length };
    });
    const preps = workIdx('pull').filter((i) => wo.done[i] != null).map((i) => wo.done[i]);
    return {
      date: PS.iso(new Date(wo.started)),
      lifts,
      pull: PS.sum(preps) > 0 ? { reps: preps, add: wo.add || 0 } : null,
      dur: Math.round(((wo.ended || Date.now()) - wo.started) / 1000),
    };
  }

  /* sound, vibration and keeping the screen on */
  function audioUnlock() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!actx) {
        actx = new AC();
        const b = actx.createBuffer(1, 1, 22050);
        const src = actx.createBufferSource();
        src.buffer = b;
        src.connect(actx.destination);
        src.start(0);
      }
      if (actx.state !== 'running') actx.resume();
    } catch (e) { /* no audio */ }
  }
  function beep(freq, dur, vol) {
    if (!state.settings.sound || !actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      const t0 = actx.currentTime;
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(actx.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.05);
    } catch (e) { /* ignore */ }
  }
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (e) { wakeLock = null; }
  }
  function releaseAwake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) { /* ignore */ }
    wakeLock = null;
  }
  function announce(msg) {
    const live = woEl && $('.wo-live', woEl);
    if (live) { live.textContent = ''; setTimeout(() => { live.textContent = msg; }, 30); }
  }

  function openWorkout() {
    if (!wo) { wo = buildWorkout(); saveWorkout(); }
    woDialog = false; woDiscardArmed = false; woMsg = '';
    if (!woEl) {
      woEl = document.createElement('div');
      woEl.className = 'wo';
      woEl.setAttribute('role', 'dialog');
      woEl.setAttribute('aria-modal', 'true');
      woEl.setAttribute('aria-labelledby', 'woName');
      woEl.innerHTML = '<div class="wo-in"></div><div class="wo-live sr" aria-live="assertive"></div>';
      document.body.appendChild(woEl);
      woEl.addEventListener('pointerdown', audioUnlock);
      woEl.addEventListener('click', onWorkoutClick);
      woEl.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); woDialog = !woDialog; renderWorkout(); }
        else if (e.key === 'Tab') trapTab(e, woEl);
      });
    }
    document.documentElement.classList.add('locked');
    setInert(true);
    audioUnlock();
    keepAwake();
    renderWorkout();
    clearInterval(woTimer);
    woTimer = setInterval(woTick, 250);
  }

  function closeWorkout() {
    clearInterval(woTimer);
    woTimer = null;
    releaseAwake();
    if (woEl) { woEl.remove(); woEl = null; }
    document.documentElement.classList.remove('locked');
    setInert(false);
  }

  function renderWorkout() {
    if (!woEl || !wo) return;
    const box = $('.wo-in', woEl);
    const ae = document.activeElement;
    const prevAct = ae && woEl.contains(ae) && ae.dataset ? ae.dataset.wo : null;
    const body = wo.phase === 'rest' ? restHTML() : wo.phase === 'done' ? finHTML() : setHTML();
    box.innerHTML = `
      <header class="wo-top">
        <button class="wo-icon" type="button" data-wo="end" aria-label="End workout">${ICON.x}</button>
        <div class="wo-title"><span class="wo-name" id="woName">${esc(PS.SESSIONS[wo.type].name)}</span><span class="wo-clock">${fmtDur((wo.ended || Date.now()) - wo.started)}</span></div>
        <button class="wo-icon" type="button" data-wo="sound" aria-pressed="${!!state.settings.sound}" aria-label="Beep when rest ends">${state.settings.sound ? ICON.sound : ICON.mute}</button>
      </header>
      ${progHTML()}
      <div class="wo-main">${body}</div>
      ${woDialog ? endDialogHTML() : ''}`;
    woTick();
    const same = prevAct && !['done', 'skiprest', 'end', 'keep', 'finish', 'undo', 'prev', 'skipwarm'].includes(prevAct) ? $(`[data-wo="${prevAct}"]`, box) : null;
    const f = same || $(woDialog ? '[data-wo="keep"]' : '.wo-go', box);
    if (f) f.focus({ preventScroll: true });
  }

  function progHTML() {
    const ks = PS.SESSIONS[wo.type].lifts.concat(['pull']);
    const curK = wo.phase === 'done' ? null : wo.steps[wo.i].k;
    return `<ol class="wo-prog" aria-label="Progress">${ks.map((k) => {
      const idx = workIdx(k);
      const n = idx.filter((i) => wo.done[i] != null).length;
      const cls = k === curK ? 'cur' : n === idx.length ? 'done' : '';
      return `<li class="${cls}"><span>${esc(k === 'pull' ? 'Pull-ups' : PS.LIFTS[k].short)}</span><b>${n}/${idx.length}</b></li>`;
    }).join('')}</ol>`;
  }

  function setHTML() {
    const i = wo.i, st = wo.steps[i];
    const pending = wo.pending != null ? wo.pending : (wo.done[i] != null ? wo.done[i] : st.reps);
    const lbl = st.kind === 'warm' ? `Warm-up ${st.n} of ${st.of}` : `Set ${st.n} of ${st.of}`;
    let what;
    if (st.k === 'pull') {
      const prevPull = PS.pullPlan(state).last;
      what = `<div class="wo-big">${wo.add ? `+${PS.kg(wo.add)}<small>kg</small>` : 'Max reps'}</div>
        <p class="wo-sub">${wo.add ? 'Max reps with the extra weight' : 'Bodyweight'}${prevPull ? ` · last time ${prevPull.reps.join(' · ')}` : ''}</p>`;
    } else {
      const w = stepWeight(st);
      const plates = PS.platesPerSide(w);
      const pt = plates == null ? '' : plates.length ? `${plates.map(PS.kg).join(' + ')} a side` : 'Empty bar';
      const adj = st.kind === 'work';
      what = `<div class="wo-wrow">
          ${adj ? '<button class="wo-adj" type="button" data-wo="w-" aria-label="2.5 kg less">−</button>' : ''}
          <div class="wo-big">${PS.kg(w)}<small>kg</small></div>
          ${adj ? '<button class="wo-adj" type="button" data-wo="w+" aria-label="2.5 kg more">+</button>' : ''}
        </div>
        <p class="wo-sub">× ${st.reps} reps${pt ? ` · ${pt}` : ''}</p>`;
    }
    const reps = st.kind === 'work' ? `<div class="wo-reps"><span>${st.k === 'pull' ? 'Reps done' : 'Reps done'}</span>
        <div class="stepper"><button type="button" data-wo="r-" aria-label="One rep fewer">−</button><output class="wo-pend" aria-live="polite">${pending}</output><button type="button" data-wo="r+" aria-label="One rep more">+</button></div></div>` : '';
    const links = [];
    if (i > 0) links.push('<button class="link" type="button" data-wo="prev">← Previous set</button>');
    if (st.kind === 'warm') links.push('<button class="link" type="button" data-wo="skipwarm">Skip warm-ups</button>');
    return `<div class="wo-set">
        <div class="wo-info">
          <p class="wo-lbl">${lbl}</p>
          <h2 class="wo-lift">${esc(liftName(st.k))}</h2>
          ${what}
          ${wo.restOver ? '<p class="wo-over"></p>' : ''}
        </div>
        <div class="wo-act">
          ${reps}
          <button class="wo-go" type="button" data-wo="done">Done</button>
          <div class="wo-links">${links.join('')}</div>
        </div>
      </div>`;
  }

  function restHTML() {
    const nx = wo.steps[wo.i];
    const lastSt = wo.steps[wo.last];
    const rem = Math.max(0, (wo.restEnd - Date.now()) / 1000);
    const C = 289.03;
    const frac = wo.restTotal ? Math.min(1, rem / wo.restTotal) : 0;
    const fix = lastSt && lastSt.kind === 'work' ? `<div class="wo-fix"><span>${esc(lastSt.k === 'pull' ? 'Pull-ups' : PS.LIFTS[lastSt.k].short)} set ${lastSt.n}</span>
        <div class="stepper sm"><button type="button" data-wo="f-" aria-label="One rep fewer">−</button><output class="wo-fixv">${wo.done[wo.last]}</output><button type="button" data-wo="f+" aria-label="One rep more">+</button></div><span>reps</span></div>` : '';
    const lastOfLift = lastSt && lastSt.kind === 'work' && lastSt.k !== 'pull' && workIdx(lastSt.k).slice(-1)[0] === wo.last;
    const cur = lastOfLift ? (wo.effort[lastSt.k] || 'clean') : null;
    const feel = lastOfLift ? `<div class="wo-feel"><p>How did ${esc(PS.LIFTS[lastSt.k].name.toLowerCase())} feel?</p>
        <div class="seg" role="radiogroup" aria-label="How did it feel">${Object.keys(EFFORT).map((e) => `<button type="button" role="radio" data-wo="feel" data-v="${e}" aria-checked="${cur === e}">${EFFORT[e].label}</button>`).join('')}</div></div>` : '';
    return `<div class="wo-rest${lastOfLift ? ' has-feel' : ''}">
        <div class="wo-info">
          <div class="ring" role="timer" aria-label="Rest time left">
            <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-track" cx="50" cy="50" r="46"/><circle class="ring-bar" cx="50" cy="50" r="46" style="stroke-dasharray:${C};stroke-dashoffset:${(C * (1 - frac)).toFixed(2)}"/></svg>
            <div class="ring-txt"><span class="ring-time">${PS.mmss(Math.ceil(rem))}</span><span class="ring-lbl">Rest</span></div>
          </div>
          <div class="wo-adjrow"><button class="btn line" type="button" data-wo="t-">−15 s</button><button class="btn line" type="button" data-wo="t+">+15 s</button></div>
        </div>
        <div class="wo-act">
          <p class="wo-next">Next: <b>${esc(stepLine(nx))}</b></p>
          ${fix}${feel}
          <button class="wo-go" type="button" data-wo="skiprest">Start next set</button>
          <div class="wo-links"><button class="link" type="button" data-wo="undo">Undo last set</button></div>
        </div>
      </div>`;
  }

  function finHTML() {
    const m = workoutModel();
    const lines = PS.SESSIONS[wo.type].lifts.map((k) => {
      const it = m.lifts[k];
      if (!it) return `<li><span class="fl-n">${esc(PS.LIFTS[k].name)}</span><span class="fl-v muted">Not done</span></li>`;
      return `<li><span class="fl-n">${esc(PS.LIFTS[k].name)}</span><span class="fl-v"><b>${PS.kg(it.w)} kg</b> × ${it.reps.join(' · ')}</span><span class="fl-s">${esc(liftWord(k, it))}</span></li>`;
    });
    lines.push(m.pull
      ? `<li><span class="fl-n">Pull-ups</span><span class="fl-v"><b>${m.pull.reps.join(' · ')}</b></span><span class="fl-s">${PS.sum(m.pull.reps)} reps${m.pull.add ? ` · +${PS.kg(m.pull.add)} kg` : ''}</span></li>`
      : '<li><span class="fl-n">Pull-ups</span><span class="fl-v muted">Not done</span></li>');
    const vol = Object.values(m.lifts).reduce((a, it) => a + it.w * PS.sum(it.reps), 0);
    return `<div class="wo-fin">
        <div class="wo-info">
          <p class="wo-lbl">Workout done</p>
          <div class="fin-time">${fmtDur(m.dur * 1000)}</div>
          ${vol ? `<p class="fin-vol">Moved <b>${Math.round(vol).toLocaleString('en-GB')} kg</b> in work sets</p>` : ''}
        </div>
        <div class="wo-act">
          <ul class="fin-list">${lines.join('')}</ul>
          ${woMsg ? `<p class="wo-msg" role="alert">${esc(woMsg)}</p>` : ''}
          <button class="wo-go" type="button" data-wo="save">Save session</button>
          <div class="wo-links"><button class="link" type="button" data-wo="review">Review details</button><button class="link${woDiscardArmed ? ' armed' : ''}" type="button" data-wo="discard">${woDiscardArmed ? 'Tap again to discard' : 'Discard'}</button></div>
        </div>
      </div>`;
  }

  function endDialogHTML() {
    return `<div class="wo-dlg" role="alertdialog" aria-modal="true" aria-labelledby="woDlgT" aria-describedby="woDlgD">
        <div class="wo-dlg-in">
          <h3 id="woDlgT">End workout?</h3>
          <p id="woDlgD">Sets you finished are kept. Save them now or throw the workout away.</p>
          <button class="btn solid" type="button" data-wo="finish">Finish and save</button>
          <button class="btn line" type="button" data-wo="keep">Keep going</button>
          <button class="btn danger${woDiscardArmed ? ' armed' : ''}" type="button" data-wo="discard">${woDiscardArmed ? 'Tap again to discard' : 'Discard workout'}</button>
        </div>
      </div>`;
  }

  function woTick() {
    if (!wo || !woEl) return;
    const now = Date.now();
    const clock = $('.wo-clock', woEl);
    if (clock) clock.textContent = fmtDur((wo.ended || now) - wo.started);
    if (wo.phase === 'rest') {
      const rem = (wo.restEnd - now) / 1000;
      if (rem <= 0) { endRest(false); return; }
      const secs = Math.ceil(rem);
      if (secs <= 3 && lastPip !== secs) { lastPip = secs; beep(880, 0.1, 0.25); }
      if (secs > 3) lastPip = null;
      const bar = $('.ring-bar', woEl);
      if (bar) bar.style.strokeDashoffset = (289.03 * (1 - Math.min(1, rem / wo.restTotal))).toFixed(2);
      const tt = $('.ring-time', woEl);
      if (tt) tt.textContent = PS.mmss(secs);
    } else if (wo.phase === 'set' && wo.restOver) {
      const o = $('.wo-over', woEl);
      const ago = Math.floor((now - wo.restOver) / 1000);
      if (o) o.textContent = ago < 10 ? 'Rest over. Go!' : `Rest over ${PS.mmss(ago)} ago`;
    }
  }

  function endRest(quiet) {
    wo.phase = 'set';
    wo.restOver = quiet ? 0 : wo.restEnd;
    wo.restEnd = 0;
    wo.pending = null;
    lastPip = null;
    saveWorkout();
    if (!quiet) {
      beep(1175, 0.5, 0.35);
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* ignore */ }
      if (!reduced && woEl) { woEl.classList.remove('flash'); void woEl.offsetWidth; woEl.classList.add('flash'); }
    }
    renderWorkout();
    announce(`Rest over. ${stepLine(wo.steps[wo.i])}`);
  }

  function finishSet() {
    const i = wo.i, st = wo.steps[i];
    const val = st.kind === 'work' ? (wo.pending != null ? wo.pending : (wo.done[i] != null ? wo.done[i] : st.reps)) : st.reps;
    wo.done[i] = val;
    wo.last = i;
    wo.pending = null;
    wo.restOver = 0;
    wo.touched = Date.now();
    if (i >= wo.steps.length - 1) {
      wo.phase = 'done';
      wo.ended = Date.now();
      announce('Workout done.');
    } else {
      wo.i = i + 1;
      const secs = restFor(st);
      if (secs > 0) {
        wo.phase = 'rest';
        wo.restTotal = secs;
        wo.restEnd = Date.now() + secs * 1000;
        lastPip = null;
        announce(`Rest ${PS.mmss(secs)}. Next: ${stepLine(wo.steps[wo.i])}`);
      } else {
        wo.phase = 'set';
        announce(stepLine(wo.steps[wo.i]));
      }
    }
    saveWorkout();
    renderWorkout();
  }

  function saveWorkoutSession() {
    const m = workoutModel();
    if (!Object.keys(m.lifts).length && !m.pull) {
      woMsg = 'Finish at least one set to save, or discard the workout.';
      renderWorkout();
      return;
    }
    const e = { id: uid(), type: wo.type, status: 'done', date: m.date, lifts: m.lifts, pull: m.pull, note: '', dur: m.dur };
    state.lifts.push(e);
    save();
    wo = null;
    saveWorkout();
    closeWorkout();
    animateCard = true;
    render();
    savedToast(e);
  }

  function onWorkoutClick(e) {
    const b = e.target.closest('[data-wo]');
    if (!b || !wo) return;
    const a = b.dataset.wo;
    const st = wo.steps[wo.i];
    wo.touched = Date.now();
    if (a !== 'discard') woDiscardArmed = false;
    switch (a) {
      case 'done': finishSet(); return;
      case 'r-': case 'r+': {
        const cur = wo.pending != null ? wo.pending : (wo.done[wo.i] != null ? wo.done[wo.i] : st.reps);
        wo.pending = Math.max(0, Math.min(60, cur + (a === 'r+' ? 1 : -1)));
        const o = $('.wo-pend', woEl);
        if (o) o.textContent = wo.pending;
        saveWorkout();
        return;
      }
      case 'w-': case 'w+': {
        wo.w[st.k] = Math.max(PS.BAR, PS.roundTo(wo.w[st.k] + (a === 'w+' ? 2.5 : -2.5), 1.25));
        saveWorkout(); renderWorkout();
        return;
      }
      case 'prev':
        if (wo.i > 0) { wo.i -= 1; wo.pending = wo.done[wo.i] != null ? wo.done[wo.i] : null; delete wo.done[wo.i]; wo.restOver = 0; wo.phase = 'set'; }
        saveWorkout(); renderWorkout();
        return;
      case 'skipwarm': {
        const j = wo.steps.findIndex((s, i) => i > wo.i && s.k === st.k && s.kind === 'work');
        if (j > 0) { wo.i = j; wo.pending = null; wo.restOver = 0; }
        saveWorkout(); renderWorkout();
        return;
      }
      case 't-': case 't+': {
        wo.restEnd += (a === 't+' ? 15 : -15) * 1000;
        const rem = (wo.restEnd - Date.now()) / 1000;
        if (rem <= 0) { endRest(true); return; }
        wo.restTotal = Math.max(wo.restTotal, Math.ceil(rem));
        saveWorkout(); woTick();
        return;
      }
      case 'skiprest': endRest(true); return;
      case 'undo':
        wo.i = wo.last; wo.pending = wo.done[wo.last]; delete wo.done[wo.last];
        wo.phase = 'set'; wo.restEnd = 0; wo.restOver = 0; wo.last = wo.i - 1;
        saveWorkout(); renderWorkout();
        return;
      case 'f-': case 'f+':
        wo.done[wo.last] = Math.max(0, Math.min(60, (wo.done[wo.last] || 0) + (a === 'f+' ? 1 : -1)));
        { const o = $('.wo-fixv', woEl); if (o) o.textContent = wo.done[wo.last]; }
        saveWorkout();
        return;
      case 'feel': {
        const k = wo.steps[wo.last].k;
        wo.effort[k] = b.dataset.v;
        saveWorkout();
        $$('[data-wo="feel"]', woEl).forEach((x) => x.setAttribute('aria-checked', x === b ? 'true' : 'false'));
        return;
      }
      case 'sound':
        state.settings.sound = !state.settings.sound;
        save();
        if (state.settings.sound) { audioUnlock(); beep(880, 0.12, 0.25); }
        renderWorkout();
        return;
      case 'end': woDialog = true; renderWorkout(); return;
      case 'keep': woDialog = false; renderWorkout(); return;
      case 'finish':
        woDialog = false;
        wo.phase = 'done'; wo.ended = Date.now(); wo.restEnd = 0;
        saveWorkout(); renderWorkout();
        return;
      case 'discard':
        if (!woDiscardArmed) { woDiscardArmed = true; renderWorkout(); return; }
        wo = null; saveWorkout(); woDialog = false; woDiscardArmed = false;
        closeWorkout(); render();
        toast('Workout discarded.');
        return;
      case 'save': saveWorkoutSession(); return;
      case 'review': {
        const m = workoutModel();
        const type = wo.type;
        closeWorkout();
        openLiftSheet({
          type, prefill: m,
          onSaved: () => { wo = null; saveWorkout(); },
          onCancel: () => openWorkout(),
        });
        return;
      }
      default:
    }
  }

  /* ---------- sheets ---------- */
  let sheet = null;
  function openSheet(o) {
    closeSheet(true);
    const el = document.createElement('div');
    el.className = 'sheet-wrap';
    el.innerHTML = `<div class="scrim" data-close></div>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="grab" aria-hidden="true"></div>
        <header class="sheet-head"><button class="link" type="button" data-close>${o.closeLabel || 'Cancel'}</button><h2 id="sheetTitle">${o.title}</h2><span></span></header>
        <div class="sheet-body">${o.body}</div>
        ${o.foot ? `<footer class="sheet-foot">${o.foot}</footer>` : ''}
      </section>`;
    document.body.appendChild(el);
